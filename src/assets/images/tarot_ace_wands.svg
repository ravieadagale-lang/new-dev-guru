<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <!-- Sky Background Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#450a0a" />
      <stop offset="30%" stop-color="#78350f" />
      <stop offset="60%" stop-color="#d97706" />
      <stop offset="85%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <!-- Golden Frame Gradient -->
    <linearGradient id="goldFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="20%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="80%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>

    <!-- Wood Bark Gradient -->
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="30%" stop-color="#78350f" />
      <stop offset="60%" stop-color="#b45309" />
      <stop offset="85%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>

    <!-- Divine Cloud Gradient -->
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="80%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Divine Hand Glow Gradient -->
    <radialGradient id="handGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="40%" stop-color="#fef08a" stop-opacity="0.8" />
      <stop offset="80%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0" />
    </radialGradient>

    <!-- River Gradient -->
    <linearGradient id="riverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Leaf Green Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac" />
      <stop offset="50%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feOffset dx="3" dy="5" result="offset" />
      <feComposite in="SourceGraphic" in2="offset" operator="over" />
    </filter>
  </defs>

  <!-- Sky Canvas -->
  <rect width="600" height="800" fill="url(#skyGrad)" rx="24" />

  <!-- Sun Radiance in Center Upper Horizon -->
  <circle cx="300" cy="280" r="180" fill="url(#handGlow)" opacity="0.6" />

  <!-- Distant Mountains & Castle Peak -->
  <!-- Blue-grey distant mountain ridge -->
  <path d="M 0 480 Q 150 420 300 460 Q 450 400 600 470 L 600 800 L 0 800 Z" fill="#334155" opacity="0.85" />
  
  <!-- Medieval Castle on Distant Hill Top (Right Side) -->
  <g id="distantCastle" transform="translate(420, 360)">
    <!-- Hill Knoll -->
    <path d="M -60 110 Q 0 70 80 110 Z" fill="#1e293b" />
    <!-- Castle Main Fortress -->
    <rect x="-30" y="30" width="60" height="50" fill="#475569" stroke="#1e293b" stroke-width="1.5" />
    <!-- Center Tower -->
    <rect x="-12" y="0" width="24" height="40" fill="#64748b" stroke="#1e293b" stroke-width="1.5" />
    <polygon points="-16,0 0,-20 16,0" fill="#b91c1c" />
    <!-- Left Turret -->
    <rect x="-32" y="15" width="14" height="30" fill="#475569" />
    <polygon points="-34,15 -25,2 -16,15" fill="#991b1b" />
    <!-- Right Turret -->
    <rect x="18" y="15" width="14" height="30" fill="#475569" />
    <polygon points="16,15 25,2 34,15" fill="#991b1b" />
    <!-- Flag Pole on Peak -->
    <line x1="0" y1="-20" x2="0" y2="-35" stroke="#fef08a" stroke-width="1.5" />
    <polygon points="0,-35 15,-28 0,-22" fill="#ef4444" />
  </g>

  <!-- Rolling Lush Green Hills -->
  <path d="M 0 520 Q 200 480 380 540 Q 500 500 600 530 L 600 800 L 0 800 Z" fill="#15803d" />
  <path d="M 0 560 Q 180 520 320 570 Q 480 530 600 580 L 600 800 L 0 800 Z" fill="#166534" />

  <!-- Winding Blue River Reflecting Sky -->
  <path d="M 380 540 C 340 590, 420 620, 320 670 C 240 710, 200 750, 150 800 L 280 800 C 380 740, 420 700, 480 640 C 520 600, 440 570, 380 540 Z" fill="url(#riverGrad)" filter="url(#shadow)" />

  <!-- Foreground Green Meadow -->
  <path d="M 0 620 Q 250 580 600 640 L 600 800 L 0 800 Z" fill="#14532d" />

  <!-- Luminous White Divine Cloud Emerging from Left -->
  <g id="divineCloud" transform="translate(0, 280)">
    <!-- Cloud Puffs -->
    <path d="M -40 80 C -20 20, 40 10, 80 40 C 110 -20, 180 -10, 210 40 C 250 20, 290 60, 270 100 C 300 130, 270 180, 220 180 C 180 210, 110 200, 80 170 C 30 190, -20 160, -40 80 Z" fill="url(#cloudGrad)" filter="url(#shadow)" />
    <!-- Inner Radiant Cloud Highlights -->
    <circle cx="100" cy="80" r="60" fill="#ffffff" opacity="0.9" />
    <circle cx="170" cy="90" r="50" fill="#ffffff" opacity="0.9" opacity="0.8" />
  </g>

  <!-- Living Vertical Sprouted Wand (Staff) in Center -->
  <g id="verticalWand" transform="translate(300, 400)">
    <!-- Wand Soft Shadow -->
    <rect x="-14" y="-280" width="28" height="520" rx="14" fill="#000000" opacity="0.25" filter="url(#shadow)" />

    <!-- Main Upright Knobby Wooden Shaft -->
    <path d="M -12 -280 C -15 -200, -8 -100, -14 0 C -8 100, -15 200, -12 240 L 12 240 C 15 200, 8 100, 14 0 C 8 -100, 15 -200, 12 -280 Z" fill="url(#woodGrad)" stroke="#451a03" stroke-width="2" />

    <!-- Wood Bark Texture Ridges & Knots -->
    <path d="M -6 -240 C -2 -220, -8 -200, -4 -180" fill="none" stroke="#27272a" stroke-width="1.5" opacity="0.6" />
    <path d="M 4 -160 C 8 -140, 2 -120, 6 -100" fill="none" stroke="#27272a" stroke-width="1.5" opacity="0.6" />
    <path d="M -8 -60 C -4 -40, -10 -20, -5 0" fill="none" stroke="#27272a" stroke-width="1.5" opacity="0.6" />
    <path d="M 5 40 C 8 70, 3 100, 7 130" fill="none" stroke="#27272a" stroke-width="1.5" opacity="0.6" />

    <!-- Knots on Wood -->
    <ellipse cx="-4" cy="-140" rx="4" ry="7" fill="#2a0404" stroke="#d97706" stroke-width="1" />
    <ellipse cx="5" cy="60" rx="5" ry="8" fill="#2a0404" stroke="#d97706" stroke-width="1" />

    <!-- Top Sprouting Tip -->
    <path d="M -12 -280 C -6 -310, 0 -325, 0 -330 C 0 -325, 6 -310, 12 -280 Z" fill="#22c55e" stroke="#15803d" stroke-width="1.5" filter="url(#glow)" />

    <!-- Lush Sprouting Leaves attached to the Wand -->
    <!-- Left Leaves -->
    <g id="leftLeaves">
      <path d="M -12 -250 Q -55 -280 -25 -220 Z" fill="url(#leafGrad)" stroke="#15803d" stroke-width="1" filter="url(#shadow)" />
      <path d="M -14 -190 Q -65 -215 -30 -160 Z" fill="url(#leafGrad)" stroke="#15803d" stroke-width="1" filter="url(#shadow)" />
      <path d="M -10 -110 Q -60 -130 -25 -80 Z" fill="url(#leafGrad)" stroke="#15803d" stroke-width="1" filter="url(#shadow)" />
      <path d="M -12 -30 Q -65 -50 -30 0 Z" fill="url(#leafGrad)" stroke="#15803d" stroke-width="1" filter="url(#shadow)" />
      <path d="M -14 50 Q -60 30 -28 80 Z" fill="url(#leafGrad)" stroke="#15803d" stroke-width="1" filter="url(#shadow)" />
      <path d="M -12 130 Q -65 110 -30 160 Z" fill="url(#leafGrad)" stroke="#15803d" stroke-width="1" filter="url(#shadow)" />
    </g>

    <!-- Right Leaves -->
    <g id="rightLeaves">
      <path d="M 12 -230 Q 55 -260 25 -200 Z" fill="url(#leafGrad)" stroke="#15803d" stroke-width="1" filter="url(#shadow)" />
      <path d="M 14 -170 Q 65 -195 30 -140 Z" fill="url(#leafGrad)" stroke="#15803d" stroke-width="1" filter="url(#shadow)" />
      <path d="M 10 -90 Q 60 -110 25 -60 Z" fill="url(#leafGrad)" stroke="#15803d" stroke-width="1" filter="url(#shadow)" />
      <path d="M 12 -10 Q 65 -30 30 20 Z" fill="url(#leafGrad)" stroke="#15803d" stroke-width="1" filter="url(#shadow)" />
      <path d="M 14 70 Q 60 50 28 100 Z" fill="url(#leafGrad)" stroke="#15803d" stroke-width="1" filter="url(#shadow)" />
      <path d="M 12 150 Q 65 130 30 180 Z" fill="url(#leafGrad)" stroke="#15803d" stroke-width="1" filter="url(#shadow)" />
    </g>
  </g>

  <!-- Divine Hand Grasping the Staff Horizontally from the Cloud -->
  <g id="divineHand" transform="translate(180, 400)">
    <!-- Wrist & Arm extending from cloud -->
    <path d="M -80 -25 L 70 -20 Q 95 0 70 25 L -80 30 Z" fill="#fde047" stroke="#b45309" stroke-width="2" filter="url(#glow)" />
    <path d="M -80 -25 L 70 -20 Q 95 0 70 25 L -80 30 Z" fill="#fed7aa" opacity="0.9" />

    <!-- Hand Palm & Wrapped Fingers around Staff (X=300 is Wand center, so relative X=120) -->
    <!-- Thumb wrapping front -->
    <path d="M 75 -20 Q 115 -35 125 -10 Q 110 5 90 -5 Z" fill="#fed7aa" stroke="#78350f" stroke-width="1.5" />
    <!-- Index Finger -->
    <path d="M 85 -10 Q 135 -15 135 5 Q 120 15 90 5 Z" fill="#fde047" stroke="#78350f" stroke-width="1.5" />
    <!-- Middle Finger -->
    <path d="M 85 5 Q 138 2 Q 138 20 Q 120 28 90 18 Z" fill="#fed7aa" stroke="#78350f" stroke-width="1.5" />
    <!-- Ring Finger -->
    <path d="M 82 18 Q 135 18 Q 135 34 Q 115 40 85 28 Z" fill="#fde047" stroke="#78350f" stroke-width="1.5" />
    <!-- Pinky Finger -->
    <path d="M 78 28 Q 125 32 Q 125 45 Q 110 50 80 38 Z" fill="#fed7aa" stroke="#78350f" stroke-width="1.5" />
  </g>

  <!-- Floating Yod Drops (Golden Sparks of Divine Will) Falling in Air -->
  <g id="floatingYods">
    <!-- Left side Yod drops -->
    <path d="M 220 220 Q 210 200 220 190 Q 230 200 220 220 Z" fill="#fef08a" stroke="#d97706" stroke-width="1" filter="url(#glow)" />
    <path d="M 200 280 Q 190 260 200 250 Q 210 260 200 280 Z" fill="#fef08a" stroke="#d97706" stroke-width="1" filter="url(#glow)" />
    <path d="M 230 350 Q 220 330 230 320 Q 240 330 230 350 Z" fill="#fef08a" stroke="#d97706" stroke-width="1" filter="url(#glow)" />
    <path d="M 210 490 Q 200 470 210 460 Q 220 470 210 490 Z" fill="#fef08a" stroke="#d97706" stroke-width="1" filter="url(#glow)" />
    <path d="M 240 560 Q 230 540 240 530 Q 250 540 240 560 Z" fill="#fef08a" stroke="#d97706" stroke-width="1" filter="url(#glow)" />

    <!-- Right side Yod drops -->
    <path d="M 380 200 Q 370 180 380 170 Q 390 180 380 200 Z" fill="#fef08a" stroke="#d97706" stroke-width="1" filter="url(#glow)" />
    <path d="M 410 260 Q 400 240 410 230 Q 420 240 410 260 Z" fill="#fef08a" stroke="#d97706" stroke-width="1" filter="url(#glow)" />
    <path d="M 370 330 Q 360 310 370 300 Q 380 310 370 330 Z" fill="#fef08a" stroke="#d97706" stroke-width="1" filter="url(#glow)" />
    <path d="M 390 470 Q 380 450 390 440 Q 400 450 390 470 Z" fill="#fef08a" stroke="#d97706" stroke-width="1" filter="url(#glow)" />
    <path d="M 360 540 Q 350 520 360 510 Q 370 520 360 540 Z" fill="#fef08a" stroke="#d97706" stroke-width="1" filter="url(#glow)" />
    <path d="M 400 600 Q 390 580 400 570 Q 410 580 400 600 Z" fill="#fef08a" stroke="#d97706" stroke-width="1" filter="url(#glow)" />
  </g>

  <!-- Ornate Golden Filigree Frame -->
  <g id="tarotBorder">
    <!-- Outer Golden Border -->
    <rect x="16" y="16" width="568" height="768" rx="20" fill="none" stroke="url(#goldFrame)" stroke-width="6" />
    <!-- Inner Dashed Filigree Border -->
    <rect x="26" y="26" width="548" height="748" rx="14" fill="none" stroke="url(#goldFrame)" stroke-width="1.5" stroke-dasharray="8,4" />

    <!-- Corner Filigree Seals -->
    <path d="M 30 60 C 30 35, 35 30, 60 30 C 45 45, 45 45, 30 60 Z" fill="url(#goldFrame)" />
    <circle cx="45" cy="45" r="4" fill="#fef08a" />

    <path d="M 570 60 C 570 35, 565 30, 540 30 C 555 45, 555 45, 570 60 Z" fill="url(#goldFrame)" />
    <circle cx="555" cy="45" r="4" fill="#fef08a" />

    <path d="M 30 740 C 30 765, 35 770, 60 770 C 45 755, 45 755, 30 740 Z" fill="url(#goldFrame)" />
    <circle cx="45" cy="755" r="4" fill="#fef08a" />

    <path d="M 570 740 C 570 765, 565 770, 540 770 C 555 755, 555 755, 570 740 Z" fill="url(#goldFrame)" />
    <circle cx="555" cy="755" r="4" fill="#fef08a" />

    <!-- Top Header Badge -->
    <g transform="translate(300, 48)">
      <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#0f172a" stroke="url(#goldFrame)" stroke-width="2" />
      <text x="0" y="5" font-family="'Cinzel', Georgia, serif" font-size="15" font-weight="bold" fill="#fef08a" text-anchor="middle" letter-spacing="2">ACE OF WANDS</text>
    </g>

    <!-- Bottom Footer Badge -->
    <g transform="translate(300, 736)">
      <rect x="-210" y="-22" width="420" height="44" rx="22" fill="#0f172a" stroke="url(#goldFrame)" stroke-width="2" />
      <text x="0" y="-2" font-family="'Cinzel', Georgia, serif" font-size="15" font-weight="bold" fill="#fef08a" text-anchor="middle">अग्नि बीज (Spark of Divine Will)</text>
      <text x="0" y="15" font-family="sans-serif" font-size="11" fill="#fdba74" text-anchor="middle" letter-spacing="1">Inspiration • Creative Drive • Passion &amp; New Enterprise</text>
    </g>
  </g>
</svg>
