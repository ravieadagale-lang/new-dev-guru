<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <!-- Sunset Atmosphere Gradients -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1028" />
      <stop offset="35%" stop-color="#581c24" />
      <stop offset="65%" stop-color="#9a3412" />
      <stop offset="85%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <linearGradient id="seaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdba74" />
      <stop offset="25%" stop-color="#c2410c" />
      <stop offset="60%" stop-color="#1e3a5f" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="goldFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="20%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="80%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <linearGradient id="staffGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="40%" stop-color="#fde047" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>

    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#fef08a" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#ea580c" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#9a3412" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="globeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#0284c7" />
      <stop offset="80%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="cloakGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#450a0a" />
    </linearGradient>

    <linearGradient id="tunicGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feOffset dx="2" dy="4" result="offset" />
      <feComposite in="SourceGraphic" in2="offset" operator="over" />
    </filter>
  </defs>

  <!-- Background Sky -->
  <rect width="600" height="800" fill="url(#skyGrad)" rx="24" />

  <!-- Setting Sun radiance -->
  <circle cx="380" cy="380" r="160" fill="url(#sunGlow)" />

  <!-- Distant Mountains across the bay -->
  <path d="M 0 420 L 80 390 L 170 410 L 260 375 L 340 405 L 430 380 L 520 415 L 600 385 L 600 460 L 0 460 Z" fill="#31132b" opacity="0.9" />
  <path d="M 0 435 L 120 410 L 230 425 L 350 395 L 480 430 L 600 405 L 600 460 L 0 460 Z" fill="#1e1b4b" opacity="0.7" />

  <!-- Ocean & Shimmering Waters -->
  <rect x="0" y="440" width="600" height="150" fill="url(#seaGrad)" />
  <path d="M 0 445 Q 150 440, 300 450 T 600 445 L 600 590 L 0 590 Z" fill="#c2410c" opacity="0.3" />
  <path d="M 300 440 L 460 440 L 490 590 L 270 590 Z" fill="#fef08a" opacity="0.15" filter="url(#glow)" />

  <!-- Castle Parapet / Battlements Structure -->
  <g id="castleStructure">
    <!-- Main Wall Block -->
    <path d="M 0 520 L 600 520 L 600 800 L 0 800 Z" fill="#1e293b" />
    <!-- Wall Texture & Shading -->
    <path d="M 0 520 L 600 520 L 600 550 L 0 550 Z" fill="#334155" />
    <line x1="0" y1="520" x2="600" y2="520" stroke="url(#goldFrame)" stroke-width="2" />

    <!-- Crenellations / Parapet Merlons -->
    <!-- Left Merlon -->
    <path d="M 20 440 L 140 440 L 140 520 L 20 520 Z" fill="#334155" stroke="#475569" stroke-width="2" />
    <path d="M 20 440 L 140 440 L 140 450 L 20 450 Z" fill="#64748b" />
    <!-- Center Left Merlon -->
    <path d="M 200 440 L 320 440 L 320 520 L 200 520 Z" fill="#334155" stroke="#475569" stroke-width="2" />
    <path d="M 200 440 L 320 440 L 320 450 L 200 450 Z" fill="#64748b" />
    <!-- Right Merlon -->
    <path d="M 460 440 L 580 440 L 580 520 L 460 520 Z" fill="#334155" stroke="#475569" stroke-width="2" />
    <path d="M 460 440 L 580 440 L 580 450 L 460 450 Z" fill="#64748b" />

    <!-- Carved Rose Cross Emblem on Left Wall -->
    <g transform="translate(80, 580)">
      <circle cx="0" cy="0" r="32" fill="#0f172a" stroke="url(#goldFrame)" stroke-width="2" />
      <path d="M -20 0 L 20 0 M 0 -20 L 0 20" stroke="#fef08a" stroke-width="3" />
      <circle cx="0" cy="0" r="10" fill="#dc2626" />
      <path d="M -8 -8 L 8 8 M -8 8 L 8 -8" stroke="#22c55e" stroke-width="2" />
    </g>
  </g>

  <!-- Left Wand (Fixed in Wall Ring Bracket) -->
  <g id="leftWand">
    <!-- Wall Iron Ring Bracket -->
    <rect x="100" y="480" width="24" height="12" rx="4" fill="#64748b" stroke="url(#goldFrame)" stroke-width="1.5" />
    <!-- Main Staff -->
    <rect x="106" y="160" width="12" height="420" rx="6" fill="url(#staffGrad)" filter="url(#softShadow)" />
    <!-- Sprouted Green Leaves -->
    <path d="M 106 200 Q 70 180 90 230 Z" fill="#22c55e" stroke="#15803d" stroke-width="1" />
    <path d="M 118 240 Q 150 220 130 270 Z" fill="#22c55e" stroke="#15803d" stroke-width="1" />
    <path d="M 106 300 Q 70 280 90 330 Z" fill="#22c55e" stroke="#15803d" stroke-width="1" />
    <path d="M 118 360 Q 150 340 130 390 Z" fill="#22c55e" stroke="#15803d" stroke-width="1" />
    <!-- Glowing Tip Flame Crown -->
    <circle cx="112" cy="160" r="10" fill="#fef08a" filter="url(#glow)" />
  </g>

  <!-- The Noble Ruler Standing Figure -->
  <g id="rulerFigure" transform="translate(260, 260)">
    <!-- Back Cloak Drape -->
    <path d="M -40 80 Q -90 180 -70 280 L 70 280 Q 90 180 40 80 Z" fill="url(#cloakGrad)" filter="url(#softShadow)" />

    <!-- Tunic & Inner Garments -->
    <path d="M -30 70 L 30 70 L 40 280 L -40 280 Z" fill="url(#tunicGrad)" />

    <!-- Belt & Sash -->
    <rect x="-32" y="130" width="64" height="12" rx="3" fill="#78350f" stroke="url(#goldFrame)" stroke-width="1.5" />

    <!-- Shoulder Mantle & Collar -->
    <path d="M -42 70 Q 0 50 42 70 L 35 110 Q 0 95 -35 110 Z" fill="#991b1b" stroke="url(#goldFrame)" stroke-width="1.5" />

    <!-- Head & Noble Profile (Looking right towards horizon) -->
    <circle cx="0" cy="30" r="22" fill="#fed7aa" />
    <!-- Hair & Cap -->
    <path d="M -22 25 Q -10 -5 20 15 Q 26 30 22 45 Q 5 40 -22 25 Z" fill="#78350f" />
    <!-- Golden Coronet Crown -->
    <path d="M -18 15 L -22 -2 L -10 5 L 0 -10 L 10 5 L 22 -2 L 18 15 Z" fill="url(#goldFrame)" stroke="#78350f" stroke-width="1" />

    <!-- Right Arm holding Glowing Terrestrial Globe -->
    <g id="rightArmAndGlobe" transform="translate(45, 100)">
      <!-- Arm -->
      <path d="M -25 -20 Q 10 -10 20 0 L 10 20 Q -10 10 -25 0 Z" fill="url(#cloakGrad)" />
      <!-- Hand holding globe -->
      <circle cx="20" cy="0" r="8" fill="#fed7aa" />

      <!-- Glowing World Globe -->
      <g transform="translate(35, -5)">
        <circle cx="0" cy="0" r="32" fill="url(#globeGrad)" stroke="url(#goldFrame)" stroke-width="2" filter="url(#glow)" />
        <!-- Continents overlay in gold shimmer -->
        <path d="M -20 -10 Q -10 -25 5 -18 Q 15 -25 25 -10 Q 10 15 -10 10 Z" fill="#fef08a" opacity="0.6" />
        <path d="M -15 10 Q 0 5 15 18 Q -5 28 -20 15 Z" fill="#fef08a" opacity="0.5" />
        <!-- Equator & Meridian Lines -->
        <ellipse cx="0" cy="0" rx="32" ry="12" fill="none" stroke="#fef08a" stroke-width="1" opacity="0.8" />
        <line x1="0" y1="-32" x2="0" y2="32" stroke="#fef08a" stroke-width="1" opacity="0.8" />
      </g>
    </g>

    <!-- Left Hand grasping Right Wand -->
    <g id="leftHandAndStaff" transform="translate(-25, 90)">
      <!-- Hand -->
      <circle cx="0" cy="0" r="9" fill="#fed7aa" />
      <!-- Right Staff (Held in hand) -->
      <rect x="-6" y="-230" width="12" height="440" rx="6" fill="url(#staffGrad)" filter="url(#softShadow)" />
      <!-- Sprouted Leaves -->
      <path d="M -6 -190 Q -40 -210 -20 -160 Z" fill="#22c55e" stroke="#15803d" stroke-width="1" />
      <path d="M 6 -150 Q 40 -170 20 -120 Z" fill="#22c55e" stroke="#15803d" stroke-width="1" />
      <path d="M -6 -90 Q -40 -110 -20 -60 Z" fill="#22c55e" stroke="#15803d" stroke-width="1" />
      <path d="M 6 -30 Q 40 -50 20 0 Z" fill="#22c55e" stroke="#15803d" stroke-width="1" />
      <!-- Glowing Tip -->
      <circle cx="0" cy="-230" r="10" fill="#fef08a" filter="url(#glow)" />
    </g>
  </g>

  <!-- Golden Mystical Ornate Border Frame -->
  <g id="tarotBorder">
    <!-- Outer Border -->
    <rect x="16" y="16" width="568" height="768" rx="20" fill="none" stroke="url(#goldFrame)" stroke-width="6" />
    <rect x="26" y="26" width="548" height="748" rx="14" fill="none" stroke="url(#goldFrame)" stroke-width="1.5" stroke-dasharray="8,4" />

    <!-- Four Corner Filigree Scrolls -->
    <!-- Top-Left -->
    <path d="M 30 60 C 30 35, 35 30, 60 30 C 45 45, 45 45, 30 60 Z" fill="url(#goldFrame)" />
    <circle cx="45" cy="45" r="4" fill="#fef08a" />
    <!-- Top-Right -->
    <path d="M 570 60 C 570 35, 565 30, 540 30 C 555 45, 555 45, 570 60 Z" fill="url(#goldFrame)" />
    <circle cx="555" cy="45" r="4" fill="#fef08a" />
    <!-- Bottom-Left -->
    <path d="M 30 740 C 30 765, 35 770, 60 770 C 45 755, 45 755, 30 740 Z" fill="url(#goldFrame)" />
    <circle cx="45" cy="755" r="4" fill="#fef08a" />
    <!-- Bottom-Right -->
    <path d="M 570 740 C 570 765, 565 770, 540 770 C 555 755, 555 755, 570 740 Z" fill="url(#goldFrame)" />
    <circle cx="555" cy="755" r="4" fill="#fef08a" />

    <!-- Top Header Badge -->
    <g transform="translate(300, 48)">
      <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#0f172a" stroke="url(#goldFrame)" stroke-width="2" />
      <text x="0" y="5" font-family="'Cinzel', Georgia, serif" font-size="15" font-weight="bold" fill="#fef08a" text-anchor="middle" letter-spacing="2">II • TWO OF WANDS</text>
    </g>

    <!-- Bottom Footer Badge -->
    <g transform="translate(300, 736)">
      <rect x="-210" y="-22" width="420" height="44" rx="22" fill="#0f172a" stroke="url(#goldFrame)" stroke-width="2" />
      <text x="0" y="-2" font-family="'Cinzel', Georgia, serif" font-size="15" font-weight="bold" fill="#fef08a" text-anchor="middle">विश्व दृष्टि (Global Vision)</text>
      <text x="0" y="15" font-family="sans-serif" font-size="11" fill="#fdba74" text-anchor="middle" letter-spacing="1">Future Planning • Bold Horizon • Ambition &amp; Expansion</text>
    </g>
  </g>
</svg>
