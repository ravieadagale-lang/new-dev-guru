<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="smokyFacet1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78716c"/>
      <stop offset="50%" stop-color="#44403c"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </linearGradient>
    <linearGradient id="smokyFacet2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a8a29e"/>
      <stop offset="50%" stop-color="#57534e"/>
      <stop offset="100%" stop-color="#292524"/>
    </linearGradient>
    <linearGradient id="smokyHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Crystal Point Generator -->
  <g filter="url(#shadow)" transform="translate(400, 270)">
    <!-- Main Point Termination Facets -->
    <polygon points="0,-180 -100,-40 0,20" fill="url(#smokyFacet2)" opacity="0.95"/>
    <polygon points="0,-180 0,20 100,-40" fill="url(#smokyFacet1)"/>
    <polygon points="0,-180 100,-40 140,-90" fill="#292524"/>
    <polygon points="0,-180 -100,-40 -140,-90" fill="#57534e" opacity="0.8"/>

    <!-- Crystal Body Prism Shaft -->
    <polygon points="-100,-40 0,20 0,200 -90,160" fill="url(#smokyFacet1)"/>
    <polygon points="0,20 100,-40 90,160 0,200" fill="url(#smokyFacet2)"/>
    <polygon points="100,-40 140,-90 130,120 90,160" fill="#1c1917"/>
    <polygon points="-100,-40 -140,-90 -130,120 -90,160" fill="#44403c"/>

    <!-- Internal Clove-Brown Refractive Lines & Flares -->
    <line x1="0" y1="-180" x2="0" y2="200" stroke="#f5f5f4" stroke-width="2" opacity="0.4"/>
    <line x1="-100" y1="-40" x2="-90" y2="160" stroke="#d6d3d1" stroke-width="1.5" opacity="0.3"/>
    <line x1="100" y1="-40" x2="90" y2="160" stroke="#ffffff" stroke-width="1.5" opacity="0.5"/>

    <!-- Specular Highlight Overlay -->
    <polygon points="0,-180 20,-30 0,20" fill="url(#smokyHighlight)"/>
  </g>

  <!-- Label Badge -->
  <rect x="220" y="520" width="360" height="44" rx="22" fill="#0c0a09" stroke="#78716c" stroke-width="1.5"/>
  <text x="400" y="548" font-family="Cinzel, Georgia, serif" font-size="18" font-weight="bold" fill="#e7e5e4" text-anchor="middle">
    SMOKY QUARTZ (धूम्र स्फटिक)
  </text>
</svg>
