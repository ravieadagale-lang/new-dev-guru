<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient: Warm Celestial Sanctuary -->
    <radialGradient id="studyBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#2a1b12"/>
      <stop offset="60%" stop-color="#18110b"/>
      <stop offset="100%" stop-color="#0a0705"/>
    </radialGradient>

    <!-- Warm Golden Aura Rim -->
    <radialGradient id="haloGlow" cx="50%" cy="38%" r="45%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#d97706" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0"/>
    </radialGradient>

    <!-- Celestial Zodiac Ring Gradient -->
    <linearGradient id="zodiacGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#d97706" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Skin Tone Gradients -->
    <linearGradient id="skinBase" x1="30%" y1="20%" x2="70%" y2="85%">
      <stop offset="0%" stop-color="#f3c299"/>
      <stop offset="50%" stop-color="#d49a6a"/>
      <stop offset="100%" stop-color="#ab6b3d"/>
    </linearGradient>
    <linearGradient id="skinShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ba7b48"/>
      <stop offset="100%" stop-color="#8c4e26"/>
    </linearGradient>

    <!-- Hair & Beard Gradient -->
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d231e"/>
      <stop offset="60%" stop-color="#1c140f"/>
      <stop offset="100%" stop-color="#0d0906"/>
    </linearGradient>

    <!-- Sacred Shawl Gradient (Cream with Gold Tone) -->
    <linearGradient id="shawlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fefce8"/>
      <stop offset="45%" stop-color="#fef08a"/>
      <stop offset="85%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>

    <!-- Dark Kurta / Robe Gradient -->
    <linearGradient id="kurtaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b18"/>
      <stop offset="50%" stop-color="#12100e"/>
      <stop offset="100%" stop-color="#080706"/>
    </linearGradient>

    <!-- Rudraksha Bead Gradient -->
    <radialGradient id="rudrakshaBead" cx="35%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#9a3412"/>
      <stop offset="60%" stop-color="#7c2d12"/>
      <stop offset="100%" stop-color="#431407"/>
    </radialGradient>

    <!-- Glasses Frame Highlight -->
    <linearGradient id="glassesGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Subtle Drop Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="400" height="400" fill="url(#studyBg)"/>

  <!-- Celestial Glow Behind Head -->
  <circle cx="200" cy="160" r="150" fill="url(#haloGlow)"/>

  <!-- Background Astrological Zodiac Mandala Wheel -->
  <g opacity="0.35">
    <circle cx="200" cy="155" r="140" fill="none" stroke="url(#zodiacGold)" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="200" cy="155" r="120" fill="none" stroke="url(#zodiacGold)" stroke-width="1"/>
    <circle cx="200" cy="155" r="95" fill="none" stroke="url(#zodiacGold)" stroke-width="0.75" stroke-dasharray="2 3"/>
    <!-- 12 Radiating Horoscope Ray Dividers -->
    <path d="M 200 15 L 200 295" stroke="url(#zodiacGold)" stroke-width="0.5" opacity="0.5"/>
    <path d="M 60 155 L 340 155" stroke="url(#zodiacGold)" stroke-width="0.5" opacity="0.5"/>
    <path d="M 101 56 L 299 254" stroke="url(#zodiacGold)" stroke-width="0.5" opacity="0.4"/>
    <path d="M 299 56 L 101 254" stroke="url(#zodiacGold)" stroke-width="0.5" opacity="0.4"/>
    <!-- Small Constellation Star Accents -->
    <circle cx="120" cy="80" r="1.5" fill="#fef08a" opacity="0.6"/>
    <circle cx="270" cy="75" r="1.8" fill="#fef08a" opacity="0.7"/>
    <circle cx="310" cy="140" r="1.2" fill="#fde047" opacity="0.5"/>
    <circle cx="85" cy="180" r="1.5" fill="#fde047" opacity="0.6"/>
  </g>

  <!-- Torso & Clothing Layer -->
  <g filter="url(#softShadow)">
    <!-- Shoulders & Black Kurta Base -->
    <path d="M 75 400 L 95 285 C 115 250, 150 240, 200 240 C 250 240, 285 250, 305 285 L 325 400 Z" fill="url(#kurtaGrad)"/>
    
    <!-- High Collar / Nehru Neckline -->
    <path d="M 170 242 C 170 232, 230 232, 230 242 L 225 258 C 210 262, 190 262, 175 258 Z" fill="#14110f"/>
    <path d="M 199 243 L 199 350" stroke="#292524" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Subtle Kurta Buttons -->
    <circle cx="199" cy="268" r="2" fill="#78716c"/>
    <circle cx="199" cy="290" r="2" fill="#78716c"/>
    <circle cx="199" cy="312" r="2" fill="#78716c"/>

    <!-- Sacred Silk Shawl Draped Over Right Shoulder (Viewer's Left) -->
    <path d="M 85 400 L 95 280 C 105 252, 130 244, 155 244 C 165 244, 175 258, 175 285 L 175 400 Z" fill="url(#shawlGrad)" opacity="0.95"/>
    <!-- Golden Embroidered Borders & Folds on Shawl -->
    <path d="M 155 244 L 175 400" stroke="#b45309" stroke-width="2" opacity="0.6"/>
    <path d="M 135 248 L 145 400" stroke="#fef08a" stroke-width="1.5" opacity="0.7"/>
    <path d="M 115 260 L 120 400" stroke="#b45309" stroke-width="1" opacity="0.4"/>
    
    <!-- Sacred Om / Sacred Glyph Motif on Shawl Border -->
    <text x="145" y="320" font-family="serif" font-size="14" font-weight="bold" fill="#78350f" opacity="0.75" text-anchor="middle">ॐ</text>
    <text x="145" y="360" font-family="serif" font-size="14" font-weight="bold" fill="#78350f" opacity="0.75" text-anchor="middle">ॐ</text>

    <!-- Sacred Rudraksha Mala (Bead Necklace) -->
    <g>
      <!-- Left side beads -->
      <circle cx="168" cy="254" r="3.5" fill="url(#rudrakshaBead)"/>
      <circle cx="172" cy="268" r="3.5" fill="url(#rudrakshaBead)"/>
      <circle cx="178" cy="282" r="3.8" fill="url(#rudrakshaBead)"/>
      <circle cx="186" cy="296" r="4" fill="url(#rudrakshaBead)"/>
      <!-- Center Guru Bead -->
      <circle cx="199" cy="305" r="4.5" fill="#c2410c"/>
      <circle cx="199" cy="305" r="2.5" fill="#f97316" opacity="0.6"/>
      <!-- Right side beads -->
      <circle cx="212" cy="296" r="4" fill="url(#rudrakshaBead)"/>
      <circle cx="220" cy="282" r="3.8" fill="url(#rudrakshaBead)"/>
      <circle cx="226" cy="268" r="3.5" fill="url(#rudrakshaBead)"/>
      <circle cx="230" cy="254" r="3.5" fill="url(#rudrakshaBead)"/>
    </g>
  </g>

  <!-- Neck & Chin Shadow -->
  <g>
    <path d="M 176 210 L 176 250 C 188 258, 212 258, 224 250 L 224 210 Z" fill="url(#skinShadow)"/>
    <path d="M 180 230 C 192 242, 208 242, 220 230 Z" fill="#7c3e1d" opacity="0.45"/>
  </g>

  <!-- Head Base & Ears -->
  <g filter="url(#softShadow)">
    <!-- Left Ear (Viewer's Left) -->
    <ellipse cx="140" cy="162" rx="7" ry="14" fill="#d49a6a"/>
    <path d="M 140 154 C 137 160, 137 166, 140 172" stroke="#ab6b3d" stroke-width="1.5" fill="none"/>
    <!-- Right Ear (Viewer's Right) -->
    <ellipse cx="260" cy="162" rx="7" ry="14" fill="#c48858"/>
    <path d="M 260 154 C 263 160, 263 166, 260 172" stroke="#99582a" stroke-width="1.5" fill="none"/>

    <!-- Face Oval (Accurate Proportions for Ravie Adagale) -->
    <path d="M 144 145 C 144 95, 256 95, 256 145 C 256 182, 240 216, 200 220 C 160 216, 144 182, 144 145 Z" fill="url(#skinBase)"/>

    <!-- Subtle Cheekbone & Jaw Contour -->
    <path d="M 148 160 C 154 185, 172 208, 200 218 C 228 208, 246 185, 252 160" fill="none" stroke="#ab6b3d" stroke-width="1.5" opacity="0.3"/>
  </g>

  <!-- Hair (Trimmed Modern Style, Dark with Soft Texture) -->
  <g>
    <!-- Back Hair Volume -->
    <path d="M 138 140 C 136 82, 264 82, 262 140 C 258 115, 245 92, 200 90 C 155 92, 142 115, 138 140 Z" fill="url(#hairGrad)"/>
    <!-- Front Hairline & Side Burns -->
    <path d="M 138 145 C 140 120, 150 102, 180 98 C 215 95, 245 102, 255 120 C 260 132, 260 148, 257 148 C 254 128, 242 108, 200 106 C 158 108, 144 128, 141 148 Z" fill="#17120e"/>
    <!-- Sideburns Left & Right -->
    <path d="M 142 138 L 144 160 L 140 162 Z" fill="#1c140f"/>
    <path d="M 258 138 L 256 160 L 260 162 Z" fill="#1c140f"/>
  </g>

  <!-- Facial Features -->
  <g>
    <!-- Eyebrows (Neat, Expressive, Intellectually Arched) -->
    <path d="M 158 142 C 168 137, 180 138, 188 143" stroke="#1c140f" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 212 143 C 220 138, 232 137, 242 142" stroke="#1c140f" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Eyes (Warm, Wise, Direct Gaze) -->
    <!-- Left Eye -->
    <ellipse cx="174" cy="152" rx="7.5" ry="4.5" fill="#ffffff"/>
    <circle cx="174" cy="152" r="3.6" fill="#382212"/>
    <circle cx="174" cy="152" r="1.8" fill="#0c0704"/>
    <circle cx="175" cy="151" r="1" fill="#ffffff"/>
    <!-- Right Eye -->
    <ellipse cx="226" cy="152" rx="7.5" ry="4.5" fill="#ffffff"/>
    <circle cx="226" cy="152" r="3.6" fill="#382212"/>
    <circle cx="226" cy="152" r="1.8" fill="#0c0704"/>
    <circle cx="227" cy="151" r="1" fill="#ffffff"/>

    <!-- Spectacles / Glasses (Key Characteristic of Ravie Adagale) -->
    <!-- Left Frame -->
    <rect x="156" y="141" width="34" height="22" rx="5" fill="none" stroke="url(#glassesGrad)" stroke-width="2.5"/>
    <rect x="157" y="142" width="32" height="20" rx="4" fill="#38bdf8" fill-opacity="0.08" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.5"/>
    <!-- Right Frame -->
    <rect x="210" y="141" width="34" height="22" rx="5" fill="none" stroke="url(#glassesGrad)" stroke-width="2.5"/>
    <rect x="211" y="142" width="32" height="20" rx="4" fill="#38bdf8" fill-opacity="0.08" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.5"/>
    <!-- Bridge & Temples -->
    <path d="M 190 148 C 196 146, 204 146, 210 148" stroke="url(#glassesGrad)" stroke-width="2.5" fill="none"/>
    <path d="M 156 146 L 141 148" stroke="url(#glassesGrad)" stroke-width="2" stroke-linecap="round"/>
    <path d="M 244 146 L 259 148" stroke="url(#glassesGrad)" stroke-width="2" stroke-linecap="round"/>

    <!-- Nose (Refined Structure with Highlight) -->
    <path d="M 197 148 L 195 174 C 194 178, 200 180, 204 178 L 202 174" stroke="#ab6b3d" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <!-- Nostrils -->
    <ellipse cx="192" cy="177" rx="2.5" ry="1.2" fill="#7c3e1d" opacity="0.6"/>
    <ellipse cx="206" cy="177" rx="2.5" ry="1.2" fill="#7c3e1d" opacity="0.6"/>

    <!-- Mustache (Neat, Distinguished, Trimmed) -->
    <path d="M 184 186 C 192 183, 198 184, 200 186 C 202 184, 208 183, 216 186 C 218 191, 208 193, 200 190 C 192 193, 182 191, 184 186 Z" fill="url(#hairGrad)"/>

    <!-- Lips (Warm, Composed Natural Expression) -->
    <path d="M 188 194 C 195 196, 205 196, 212 194" stroke="#99582a" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    
    <!-- Goatee Beard (Neat on Chin, Defining Lower Face) -->
    <path d="M 194 198 C 194 196, 206 196, 206 198 C 208 206, 205 214, 200 215 C 195 214, 192 206, 194 198 Z" fill="url(#hairGrad)"/>
    <path d="M 186 208 C 193 216, 207 216, 214 208 C 210 218, 190 218, 186 208 Z" fill="#1c140f" opacity="0.7"/>
  </g>

  <!-- Contemplative Right Hand (Posed under chin / cheek as in photograph) -->
  <g filter="url(#softShadow)">
    <!-- Forearm / Hand rising up to chin -->
    <path d="M 230 250 C 238 230, 245 208, 245 195 C 245 186, 238 186, 234 196 C 230 206, 226 220, 222 245 Z" fill="url(#skinBase)"/>
    <!-- Fingers gently resting near cheek -->
    <ellipse cx="242" cy="192" rx="4" ry="7" transform="rotate(-15 242 192)" fill="#e5ad7d"/>
    <ellipse cx="247" cy="198" rx="3.5" ry="6" transform="rotate(-10 247 198)" fill="#d49a6a"/>
    <ellipse cx="249" cy="207" rx="3.5" ry="6" transform="rotate(-5 249 207)" fill="#ab6b3d"/>

    <!-- Rudraksha Bead Bracelet on Wrist -->
    <g>
      <circle cx="230" cy="246" r="3.2" fill="url(#rudrakshaBead)"/>
      <circle cx="235" cy="244" r="3.2" fill="url(#rudrakshaBead)"/>
      <circle cx="240" cy="243" r="3.2" fill="url(#rudrakshaBead)"/>
      <circle cx="245" cy="243" r="3.2" fill="url(#rudrakshaBead)"/>
      <circle cx="250" cy="245" r="3.2" fill="url(#rudrakshaBead)"/>
    </g>
  </g>

  <!-- Elegant Golden Vignette Border -->
  <rect x="8" y="8" width="384" height="384" rx="24" fill="none" stroke="url(#zodiacGold)" stroke-width="2" opacity="0.5"/>
  <!-- Corner Knot Accents -->
  <circle cx="24" cy="24" r="3" fill="#f59e0b" opacity="0.6"/>
  <circle cx="376" cy="24" r="3" fill="#f59e0b" opacity="0.6"/>
  <circle cx="24" cy="376" r="3" fill="#f59e0b" opacity="0.6"/>
  <circle cx="376" cy="376" r="3" fill="#f59e0b" opacity="0.6"/>
</svg>
