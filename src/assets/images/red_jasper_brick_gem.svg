<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#450a0a"/>
      <stop offset="50%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#180505"/>
    </linearGradient>
    <radialGradient id="jasperGrad" cx="38%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="35%" stop-color="#ef4444"/>
      <stop offset="70%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </radialGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="50%" y2="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Brick Red Jasper Opaque Stone -->
  <g filter="url(#shadow)">
    <path d="M 280 180 C 400 120, 560 160, 580 280 C 600 400, 480 480, 360 460 C 240 440, 180 320, 280 180 Z" fill="url(#jasperGrad)"/>
  </g>

  <!-- Dark Earthy Veins and Iron Layers -->
  <path d="M 240 320 Q 350 260, 480 340" fill="none" stroke="#450a0a" stroke-width="4" opacity="0.6"/>
  <path d="M 310 210 Q 420 250, 540 220" fill="none" stroke="#7f1d1d" stroke-width="3" opacity="0.5"/>
  <path d="M 360 380 Q 460 410, 520 370" fill="none" stroke="#260404" stroke-width="3" opacity="0.65"/>

  <!-- High Gloss Polish Highlight -->
  <path d="M 310 200 C 400 150, 480 180, 510 230 C 450 220, 370 210, 310 200 Z" fill="url(#shine)"/>
  <circle cx="330" cy="190" r="10" fill="#ffffff" opacity="0.85"/>

  <!-- Label Badge -->
  <rect x="220" y="520" width="360" height="44" rx="22" fill="#450a0a" stroke="#f87171" stroke-width="1.5"/>
  <text x="400" y="548" font-family="Cinzel, Georgia, serif" font-size="18" font-weight="bold" fill="#fef2f2" text-anchor="middle">
    NATURAL RED JASPER (रक्त जस्पर)
  </text>
</svg>
