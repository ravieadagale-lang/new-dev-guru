<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c1a" />
      <stop offset="40%" stop-color="#121b3d" />
      <stop offset="80%" stop-color="#1d3557" />
      <stop offset="100%" stop-color="#0b132b" />
    </linearGradient>

    <!-- Water & Ocean Gradient -->
    <linearGradient id="seaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#0284c7" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#032b43" />
    </linearGradient>

    <!-- Gold Foil & Filigree -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="25%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="75%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>

    <!-- Pearl & Shell Gradient -->
    <linearGradient id="pearlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>

    <!-- Robe Teal Gradient -->
    <linearGradient id="robeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="50%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#115e59" />
    </linearGradient>

    <linearGradient id="mantleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="600" height="800" fill="url(#skyGrad)" rx="20" />

  <!-- Starry Sky & Nebula Glows -->
  <g opacity="0.8">
    <ellipse cx="300" cy="220" rx="220" ry="140" fill="#38bdf8" opacity="0.15" filter="url(#glow)" />
    <ellipse cx="180" cy="150" rx="120" ry="80" fill="#c084fc" opacity="0.12" filter="url(#glow)" />
    <circle cx="120" cy="100" r="2" fill="#fff" />
    <circle cx="180" cy="70" r="1.5" fill="#fef08a" />
    <circle cx="280" cy="110" r="2.5" fill="#fff" opacity="0.9" />
    <circle cx="360" cy="80" r="1.8" fill="#bae6fd" />
    <circle cx="450" cy="130" r="2.2" fill="#fff" />
    <circle cx="510" cy="90" r="1.5" fill="#fef08a" />
    <circle cx="80" cy="220" r="2" fill="#fff" />
    <circle cx="520" cy="240" r="2.5" fill="#38bdf8" />
  </g>

  <!-- Ornate Outer Gold Border Frame -->
  <rect x="18" y="18" width="564" height="764" fill="none" stroke="url(#gold)" stroke-width="5" rx="16" />
  <rect x="28" y="28" width="544" height="744" fill="none" stroke="url(#gold)" stroke-width="1.5" stroke-dasharray="6,4" rx="12" />

  <!-- Corner Filigree Ornaments -->
  <g stroke="url(#gold)" stroke-width="2" fill="none">
    <path d="M 35 60 Q 60 60 60 35" />
    <path d="M 565 60 Q 540 60 540 35" />
    <path d="M 35 740 Q 60 740 60 765" />
    <path d="M 565 740 Q 540 740 540 765" />
  </g>

  <!-- Card Header Badge -->
  <g transform="translate(300, 52)">
    <rect x="-140" y="-18" width="280" height="36" fill="#0b132b" stroke="url(#gold)" stroke-width="2" rx="18" />
    <text x="0" y="5" font-family="'Cinzel', Georgia, serif" font-size="16" font-weight="bold" fill="#fef08a" text-anchor="middle" letter-spacing="2">QUEEN OF CUPS</text>
  </g>

  <!-- Celestial Sea & Shore Line -->
  <path d="M 30 520 C 150 490, 250 540, 360 510 C 450 480, 520 520, 570 510 L 570 760 L 30 760 Z" fill="url(#seaGrad)" />

  <!-- Gentle Ocean Foam & Waves -->
  <path d="M 30 540 Q 150 510 300 550 T 570 530" fill="none" stroke="#bae6fd" stroke-width="3" opacity="0.7" />
  <path d="M 30 590 Q 200 560 380 600 T 570 580" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.5" />

  <!-- Glowing Sea Lotus Flowers at Shore -->
  <g transform="translate(100, 680)">
    <path d="M -20 0 Q 0 -30 20 0 Q 0 10 -20 0 Z" fill="url(#pearlGrad)" />
    <path d="M -10 -5 Q 0 -35 10 -5" fill="#f472b6" opacity="0.7" />
    <circle cx="0" cy="-5" r="4" fill="#fef08a" />
  </g>
  <g transform="translate(500, 690)">
    <path d="M -20 0 Q 0 -30 20 0 Q 0 10 -20 0 Z" fill="url(#pearlGrad)" />
    <path d="M -10 -5 Q 0 -35 10 -5" fill="#38bdf8" opacity="0.7" />
    <circle cx="0" cy="-5" r="4" fill="#fef08a" />
  </g>

  <!-- Seashell Throne Back -->
  <g transform="translate(300, 360)">
    <!-- Shell Fan Backdrop -->
    <path d="M -130 100 Q -160 -80 0 -130 Q 160 -80 130 100 Z" fill="url(#pearlGrad)" stroke="url(#gold)" stroke-width="3" />
    <path d="M 0 100 L 0 -130" stroke="url(#gold)" stroke-width="1.5" />
    <path d="M 0 100 L -40 -120" stroke="url(#gold)" stroke-width="1.5" />
    <path d="M 0 100 L 40 -120" stroke="url(#gold)" stroke-width="1.5" />
    <path d="M 0 100 L -80 -100" stroke="url(#gold)" stroke-width="1.5" />
    <path d="M 0 100 L 80 -100" stroke="url(#gold)" stroke-width="1.5" />
    <path d="M 0 100 L -110 -60" stroke="url(#gold)" stroke-width="1.5" />
    <path d="M 0 100 L 110 -60" stroke="url(#gold)" stroke-width="1.5" />
    <!-- Pearl Top Jewel -->
    <circle cx="0" cy="-130" r="12" fill="url(#pearlGrad)" stroke="url(#gold)" stroke-width="2" />
  </g>

  <!-- Queen Figure -->
  <!-- Robe Body -->
  <g transform="translate(300, 380)">
    <!-- Mantle Cape -->
    <path d="M -70 -20 Q 0 -40 70 -20 L 110 180 Q 0 210 -110 180 Z" fill="url(#mantleGrad)" />
    <path d="M -50 -10 Q 0 -30 50 -10 L 80 170 Q 0 190 -80 170 Z" fill="url(#robeGrad)" />

    <!-- Gold Embroidered Hem -->
    <path d="M -80 170 Q 0 190 80 170" fill="none" stroke="url(#gold)" stroke-width="4" />

    <!-- Head & Face -->
    <circle cx="0" cy="-70" r="28" fill="#fde047" opacity="0.2" filter="url(#glow)" /> <!-- Halo -->
    <path d="M -16 -85 Q 0 -100 16 -85 Q 22 -60 0 -50 Q -22 -60 -16 -85 Z" fill="#fed7aa" /> <!-- Face -->
    <!-- Serene Eyes & Features -->
    <path d="M -8 -70 Q -4 -73 0 -70" stroke="#7c2d12" stroke-width="1.5" fill="none" />
    <path d="M 0 -70 Q 4 -73 8 -70" stroke="#7c2d12" stroke-width="1.5" fill="none" />
    <path d="M -4 -60 Q 0 -57 4 -60" stroke="#e11d48" stroke-width="1.5" fill="none" />

    <!-- Golden Crown -->
    <path d="M -22 -85 L -28 -115 L -12 -98 L 0 -120 L 12 -98 L 28 -115 L 22 -85 Z" fill="url(#gold)" stroke="#ca8a04" stroke-width="1" />
    <circle cx="0" cy="-120" r="4" fill="#38bdf8" />
    <circle cx="-28" cy="-115" r="3" fill="#f472b6" />
    <circle cx="28" cy="-115" r="3" fill="#f472b6" />

    <!-- Flowing Hair -->
    <path d="M -22 -80 Q -35 -40 -25 0" stroke="#fef08a" stroke-width="6" fill="none" stroke-linecap="round" />
    <path d="M 22 -80 Q 35 -40 25 0" stroke="#fef08a" stroke-width="6" fill="none" stroke-linecap="round" />

    <!-- Regal Arms holding the Angelic Chalice -->
    <!-- Left & Right Sleeves -->
    <path d="M -45 -10 Q -65 30 -25 50" stroke="url(#robeGrad)" stroke-width="16" fill="none" stroke-linecap="round" />
    <path d="M 45 -10 Q 65 30 25 50" stroke="url(#robeGrad)" stroke-width="16" fill="none" stroke-linecap="round" />

    <!-- Magnificent Angelic Golden Chalice (Center Piece) -->
    <g transform="translate(0, 30)" filter="url(#glow)">
      <!-- Golden Chalice Base -->
      <path d="M -25 50 L 25 50 L 15 40 L -15 40 Z" fill="url(#gold)" />
      <rect x="-6" y="10" width="12" height="30" fill="url(#gold)" />
      <circle cx="0" cy="25" r="8" fill="url(#gold)" stroke="#38bdf8" stroke-width="1.5" />

      <!-- Chalice Bowl -->
      <path d="M -40 -30 Q -45 10 0 15 Q 45 10 40 -30 Z" fill="url(#gold)" />

      <!-- Angelic Lid with Wings -->
      <path d="M -40 -30 Q 0 -55 40 -30 Z" fill="url(#gold)" />
      <!-- Wing Handles -->
      <path d="M -40 -20 Q -65 -45 -35 -50 Q -25 -30 -35 -10 Z" fill="url(#gold)" />
      <path d="M 40 -20 Q 65 -45 35 -50 Q 25 -30 35 -10 Z" fill="url(#gold)" />
      <!-- Top Cross & Pearl -->
      <circle cx="0" cy="-58" r="6" fill="url(#pearlGrad)" stroke="url(#gold)" stroke-width="1.5" />
      <path d="M -8 -68 L 8 -68 M 0 -76 L 0 -60" stroke="url(#gold)" stroke-width="2" />
    </g>

    <!-- Hands holding base & stem -->
    <circle cx="-18" cy="65" r="7" fill="#fed7aa" />
    <circle cx="18" cy="65" r="7" fill="#fed7aa" />
  </g>

  <!-- Sanskrit Label & Subtitle Footer -->
  <g transform="translate(300, 735)">
    <text x="0" y="0" font-family="sans-serif" font-size="16" font-weight="bold" fill="#fef08a" text-anchor="middle">सहानुभूति महारानी (Queen of Compassion)</text>
    <text x="0" y="18" font-family="sans-serif" font-size="12" fill="#bae6fd" text-anchor="middle" opacity="0.9">Empathy • Psychic Intuition • Emotional Depth • Nurturing Grace</text>
  </g>
</svg>
