<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a0404" />
      <stop offset="35%" stop-color="#7c2d12" />
      <stop offset="65%" stop-color="#c2410c" />
      <stop offset="85%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <linearGradient id="goldFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="20%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="80%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <linearGradient id="throneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="80%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <linearGradient id="staffGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="40%" stop-color="#fde047" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>

    <linearGradient id="kingRobe" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#9a3412" />
    </linearGradient>

    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#fef08a" stop-opacity="0.6" />
      <stop offset="80%" stop-color="#f97316" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#7c2d12" stop-opacity="0" />
    </radialGradient>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feOffset dx="2" dy="4" result="offset" />
      <feComposite in="SourceGraphic" in2="offset" operator="over" />
    </filter>
  </defs>

  <!-- Background Sky -->
  <rect width="600" height="800" fill="url(#skyGrad)" rx="24" />

  <!-- Sun Radiance Aura -->
  <circle cx="300" cy="240" r="220" fill="url(#sunGlow)" />

  <!-- Background Pyramidal Mountains -->
  <polygon points="20,500 160,320 300,500" fill="#7c2d12" opacity="0.8" />
  <polygon points="300,500 440,340 580,500" fill="#9a3412" opacity="0.9" />

  <!-- Ground Terrain -->
  <path d="M 0 500 Q 300 460 600 500 L 600 800 L 0 800 Z" fill="#b45309" />
  <path d="M 0 540 Q 300 500 600 540 L 600 800 L 0 800 Z" fill="#78350f" />

  <!-- Golden Salamander & Lion Throne -->
  <g id="kingThrone" transform="translate(170, 180)">
    <!-- Backrest with Salamanders & Lions Carved -->
    <rect x="20" y="0" width="220" height="360" rx="20" fill="url(#throneGrad)" stroke="url(#goldFrame)" stroke-width="3" filter="url(#softShadow)" />
    <!-- Lion Head Carvings on Top Corners -->
    <circle cx="30" cy="30" r="20" fill="#fde047" stroke="#b45309" stroke-width="2" />
    <circle cx="230" cy="30" r="20" fill="#fde047" stroke="#b45309" stroke-width="2" />

    <!-- Flame Tapestry Backing -->
    <path d="M 50 60 Q 130 30 210 60 L 200 320 L 60 320 Z" fill="#dc2626" opacity="0.8" />

    <!-- Throne Seat Base -->
    <rect x="0" y="260" width="260" height="100" rx="10" fill="url(#throneGrad)" stroke="url(#goldFrame)" stroke-width="3" />
  </g>

  <!-- King Enthroned -->
  <g id="kingFigure" transform="translate(300, 240)">
    <!-- Fiery Orange & Gold Royal Robe -->
    <path d="M -55 80 Q -110 200 -80 320 L 80 320 Q 110 200 55 80 Z" fill="url(#kingRobe)" filter="url(#softShadow)" />

    <!-- Salamander / Ouroboros Pattern on Robe -->
    <circle cx="0" cy="180" r="24" fill="none" stroke="#fde047" stroke-width="4" stroke-dasharray="12,6" />
    <circle cx="0" cy="240" r="24" fill="none" stroke="#fde047" stroke-width="4" stroke-dasharray="12,6" />

    <!-- Green Mantle Collar -->
    <path d="M -40 70 Q 0 50 40 70 L 30 110 Q 0 95 -30 110 Z" fill="#15803d" stroke="url(#goldFrame)" stroke-width="1.5" />

    <!-- King Head & Crown -->
    <circle cx="0" cy="20" r="25" fill="#fed7aa" />

    <!-- Golden Flame Crown -->
    <path d="M -24 8 L -28 -18 L -14 -6 L 0 -26 L 14 -6 L 28 -18 L 24 8 Z" fill="url(#goldFrame)" stroke="#78350f" stroke-width="1.5" filter="url(#glow)" />

    <!-- Right Arm Holding Sprouted Sovereign Staff -->
    <g transform="translate(50, 50)">
      <rect x="-8" y="-180" width="16" height="440" rx="8" fill="url(#staffGrad)" filter="url(#softShadow)" />
      <circle cx="0" cy="-180" r="14" fill="#fef08a" filter="url(#glow)" />
      <!-- Sprouted Leaves -->
      <path d="M 8 -140 Q 40 -160 20 -110 Z" fill="#22c55e" stroke="#15803d" stroke-width="1" />
      <path d="M -8 -100 Q -40 -120 -20 -70 Z" fill="#22c55e" stroke="#15803d" stroke-width="1" />
      <path d="M 8 -60 Q 40 -80 20 -30 Z" fill="#22c55e" stroke="#15803d" stroke-width="1" />
    </g>
  </g>

  <!-- Mystical Fire Salamander at King's Feet -->
  <g id="salamander" transform="translate(420, 550)">
    <path d="M -20 0 Q 0 -15 20 0 Q 30 15 10 20 Q -10 25 -20 0 Z" fill="#ea580c" stroke="#fef08a" stroke-width="2" filter="url(#glow)" />
    <!-- Small Legs & Tail -->
    <path d="M 10 20 Q 30 35 40 25" fill="none" stroke="#ea580c" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Golden Mystical Ornate Border Frame -->
  <g id="tarotBorder">
    <!-- Outer Border -->
    <rect x="16" y="16" width="568" height="768" rx="20" fill="none" stroke="url(#goldFrame)" stroke-width="6" />
    <rect x="26" y="26" width="548" height="748" rx="14" fill="none" stroke="url(#goldFrame)" stroke-width="1.5" stroke-dasharray="8,4" />

    <!-- Four Corner Filigree Scrolls -->
    <path d="M 30 60 C 30 35, 35 30, 60 30 C 45 45, 45 45, 30 60 Z" fill="url(#goldFrame)" />
    <circle cx="45" cy="45" r="4" fill="#fef08a" />
    <path d="M 570 60 C 570 35, 565 30, 540 30 C 555 45, 555 45, 570 60 Z" fill="url(#goldFrame)" />
    <circle cx="555" cy="45" r="4" fill="#fef08a" />
    <path d="M 30 740 C 30 765, 35 770, 60 770 C 45 755, 45 755, 30 740 Z" fill="url(#goldFrame)" />
    <circle cx="45" cy="755" r="4" fill="#fef08a" />
    <path d="M 570 740 C 570 765, 565 770, 540 770 C 555 755, 555 755, 570 740 Z" fill="url(#goldFrame)" />
    <circle cx="555" cy="755" r="4" fill="#fef08a" />

    <!-- Top Header Badge -->
    <g transform="translate(300, 48)">
      <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#0f172a" stroke="url(#goldFrame)" stroke-width="2" />
      <text x="0" y="5" font-family="'Cinzel', Georgia, serif" font-size="15" font-weight="bold" fill="#fef08a" text-anchor="middle" letter-spacing="2">KING OF WANDS</text>
    </g>

    <!-- Bottom Footer Badge -->
    <g transform="translate(300, 736)">
      <rect x="-210" y="-22" width="420" height="44" rx="22" fill="#0f172a" stroke="url(#goldFrame)" stroke-width="2" />
      <text x="0" y="-2" font-family="'Cinzel', Georgia, serif" font-size="15" font-weight="bold" fill="#fef08a" text-anchor="middle">अग्नि सम्राट (Master of Divine Will)</text>
      <text x="0" y="15" font-family="sans-serif" font-size="11" fill="#fdba74" text-anchor="middle" letter-spacing="1">Visionary Leader • Inspiration • Command &amp; Fiery Mastery</text>
    </g>
  </g>
</svg>
