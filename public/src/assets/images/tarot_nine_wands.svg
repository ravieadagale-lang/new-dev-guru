<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="35%" stop-color="#312e81" />
      <stop offset="65%" stop-color="#4c1d95" />
      <stop offset="85%" stop-color="#831843" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <linearGradient id="goldFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="20%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="80%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <linearGradient id="staffGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="40%" stop-color="#fde047" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feOffset dx="2" dy="4" result="offset" />
      <feComposite in="SourceGraphic" in2="offset" operator="over" />
    </filter>
  </defs>

  <!-- Background Sky -->
  <rect width="600" height="800" fill="url(#skyGrad)" rx="24" />

  <!-- Ground Terrain -->
  <path d="M 0 540 Q 300 500 600 540 L 600 800 L 0 800 Z" fill="#3f6212" />
  <path d="M 0 580 Q 300 540 600 580 L 600 800 L 0 800 Z" fill="#14532d" />

  <!-- Defensive Palisade Wall formed by Eight Staves standing in a row behind the figure -->
  <g id="palisadeEightStaves">
    <rect x="70" y="180" width="16" height="420" rx="8" fill="url(#staffGrad)" filter="url(#softShadow)" />
    <circle cx="78" cy="180" r="10" fill="#fef08a" />

    <rect x="130" y="160" width="16" height="440" rx="8" fill="url(#staffGrad)" filter="url(#softShadow)" />
    <circle cx="138" cy="160" r="10" fill="#fef08a" />

    <rect x="190" y="200" width="16" height="400" rx="8" fill="url(#staffGrad)" filter="url(#softShadow)" />
    <circle cx="198" cy="200" r="10" fill="#fef08a" />

    <rect x="250" y="170" width="16" height="430" rx="8" fill="url(#staffGrad)" filter="url(#softShadow)" />
    <circle cx="258" cy="170" r="10" fill="#fef08a" />

    <rect x="310" y="190" width="16" height="410" rx="8" fill="url(#staffGrad)" filter="url(#softShadow)" />
    <circle cx="318" cy="190" r="10" fill="#fef08a" />

    <rect x="370" y="160" width="16" height="440" rx="8" fill="url(#staffGrad)" filter="url(#softShadow)" />
    <circle cx="378" cy="160" r="10" fill="#fef08a" />

    <rect x="430" y="200" width="16" height="400" rx="8" fill="url(#staffGrad)" filter="url(#softShadow)" />
    <circle cx="438" cy="200" r="10" fill="#fef08a" />

    <rect x="490" y="180" width="16" height="420" rx="8" fill="url(#staffGrad)" filter="url(#softShadow)" />
    <circle cx="498" cy="180" r="10" fill="#fef08a" />
  </g>

  <!-- Vigilant Guard Figure in Foreground -->
  <g id="guardFigure" transform="translate(280, 280)">
    <!-- Cloak & Garment -->
    <path d="M -35 50 Q -70 140 -50 240 L 50 240 Q 70 140 35 50 Z" fill="#9a3412" filter="url(#softShadow)" />
    <path d="M -25 40 L 25 40 L 30 230 L -30 230 Z" fill="#ca8a04" />

    <!-- Head with White Bandage -->
    <circle cx="0" cy="10" r="22" fill="#fed7aa" />
    <rect x="-22" y="-2" width="44" height="12" rx="3" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
    <path d="M -22 10 Q 0 -15 22 10 Z" fill="#78350f" />

    <!-- Main Guard Staff Held firmly with both hands -->
    <g transform="translate(35, 10)">
      <rect x="-8" y="-140" width="16" height="460" rx="8" fill="url(#staffGrad)" filter="url(#softShadow)" />
      <circle cx="0" cy="-140" r="10" fill="#fef08a" filter="url(#glow)" />
      <!-- Sprouted Leaves -->
      <path d="M 8 -100 Q 40 -120 20 -70 Z" fill="#22c55e" stroke="#15803d" stroke-width="1" />
      <path d="M -8 -40 Q -40 -60 -20 -10 Z" fill="#22c55e" stroke="#15803d" stroke-width="1" />
    </g>

    <!-- Arms Clasping the Ninth Staff -->
    <line x1="-15" y1="50" x2="25" y2="50" stroke="#fed7aa" stroke-width="12" stroke-linecap="round" />
  </g>

  <!-- Golden Mystical Ornate Border Frame -->
  <g id="tarotBorder">
    <!-- Outer Border -->
    <rect x="16" y="16" width="568" height="768" rx="20" fill="none" stroke="url(#goldFrame)" stroke-width="6" />
    <rect x="26" y="26" width="548" height="748" rx="14" fill="none" stroke="url(#goldFrame)" stroke-width="1.5" stroke-dasharray="8,4" />

    <!-- Four Corner Filigree Scrolls -->
    <path d="M 30 60 C 30 35, 35 30, 60 30 C 45 45, 45 45, 30 60 Z" fill="url(#goldFrame)" />
    <circle cx="45" cy="45" r="4" fill="#fef08a" />
    <path d="M 570 60 C 570 35, 565 30, 540 30 C 555 45, 555 45, 570 60 Z" fill="url(#goldFrame)" />
    <circle cx="555" cy="45" r="4" fill="#fef08a" />
    <path d="M 30 740 C 30 765, 35 770, 60 770 C 45 755, 45 755, 30 740 Z" fill="url(#goldFrame)" />
    <circle cx="45" cy="755" r="4" fill="#fef08a" />
    <path d="M 570 740 C 570 765, 565 770, 540 770 C 555 755, 555 755, 570 740 Z" fill="url(#goldFrame)" />
    <circle cx="555" cy="755" r="4" fill="#fef08a" />

    <!-- Top Header Badge -->
    <g transform="translate(300, 48)">
      <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#0f172a" stroke="url(#goldFrame)" stroke-width="2" />
      <text x="0" y="5" font-family="'Cinzel', Georgia, serif" font-size="15" font-weight="bold" fill="#fef08a" text-anchor="middle" letter-spacing="2">IX • NINE OF WANDS</text>
    </g>

    <!-- Bottom Footer Badge -->
    <g transform="translate(300, 736)">
      <rect x="-210" y="-22" width="420" height="44" rx="22" fill="#0f172a" stroke="url(#goldFrame)" stroke-width="2" />
      <text x="0" y="-2" font-family="'Cinzel', Georgia, serif" font-size="15" font-weight="bold" fill="#fef08a" text-anchor="middle">दृढ़ निष्ठा (Resilient Sentinel)</text>
      <text x="0" y="15" font-family="sans-serif" font-size="11" fill="#fdba74" text-anchor="middle" letter-spacing="1">Resilience • Vigilance • Last Stand &amp; Final Stretch</text>
    </g>
  </g>
</svg>
