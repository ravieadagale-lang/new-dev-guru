<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="earthBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061a12" />
      <stop offset="50%" stop-color="#113826" />
      <stop offset="100%" stop-color="#04120c" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
  </defs>

  <rect width="600" height="800" fill="url(#earthBg)" rx="24" />

  <!-- Stars & Emerald Sparkles -->
  <circle cx="100" cy="110" r="2.5" fill="#fef08a" opacity="0.9" />
  <circle cx="480" cy="140" r="3" fill="#4ade80" opacity="0.8" />

  <!-- Frame -->
  <rect x="20" y="20" width="560" height="760" fill="none" stroke="url(#goldGrad)" stroke-width="6" rx="16" />
  <rect x="30" y="30" width="540" height="740" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="8,4" rx="12" />

  <!-- Title Badge -->
  <rect x="130" y="45" width="340" height="40" fill="#061a12" stroke="url(#goldGrad)" stroke-width="2" rx="20" />
  <text x="300" y="71" font-family="'Cinzel', Georgia, serif" font-size="18" font-weight="bold" fill="#fef08a" text-anchor="middle" letter-spacing="2">QUEEN OF PENTACLES</text>

  <!-- Queen Symbolism: Queen Crown & Golden Pentacle surrounded by flora -->
  <g transform="translate(300, 390)">
    <!-- Crown -->
    <path d="M -60,-140 L -40,-180 L 0,-150 L 40,-180 L 60,-140 Z" fill="url(#goldGrad)" stroke="#061a12" stroke-width="2" />
    <circle cx="0" cy="-150" r="6" fill="#22c55e" />
    
    <!-- Queen's Floral Aura -->
    <circle cx="0" cy="0" r="130" fill="none" stroke="#22c55e" stroke-width="2" opacity="0.5" stroke-dasharray="6,6" />
    
    <!-- Central Golden Pentacle -->
    <circle cx="0" cy="0" r="85" fill="url(#goldGrad)" />
    <circle cx="0" cy="0" r="72" fill="none" stroke="#061a12" stroke-width="3" />
    <polygon points="0,-60 18,-20 58,-20 26,5 37,45 0,20 -37,45 -26,5 -58,-20 -18,-20" fill="#061a12" />
    
    <!-- Vines & Flowers -->
    <path d="M -130,0 C -130,80 -80,120 0,130 C 80,120 130,80 130,0" fill="none" stroke="#4ade80" stroke-width="4" />
    <circle cx="-100" cy="80" r="10" fill="#fef08a" />
    <circle cx="100" cy="80" r="10" fill="#fef08a" />
  </g>

  <!-- Sanskrit Title -->
  <text x="300" y="720" font-family="sans-serif" font-size="16" fill="#fef08a" text-anchor="middle" opacity="0.9">अन्नपूर्णा स्वामिनी (Queen of Earthly Abundance)</text>
</svg>
