<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#180404" />
      <stop offset="35%" stop-color="#581c24" />
      <stop offset="65%" stop-color="#9a3412" />
      <stop offset="85%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <linearGradient id="goldFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="20%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="80%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <linearGradient id="staffGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="40%" stop-color="#fde047" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>

    <linearGradient id="rockGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="50%" stop-color="#451a03" />
      <stop offset="100%" stop-color="#1c1917" />
    </linearGradient>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feOffset dx="2" dy="4" result="offset" />
      <feComposite in="SourceGraphic" in2="offset" operator="over" />
    </filter>
  </defs>

  <!-- Background Sky -->
  <rect width="600" height="800" fill="url(#skyGrad)" rx="24" />

  <!-- High Rocky Ledge Promontory -->
  <path d="M 0 540 L 280 480 L 420 540 L 600 500 L 600 800 L 0 800 Z" fill="url(#rockGrad)" filter="url(#softShadow)" />
  <path d="M 0 540 L 280 480 L 320 510 L 120 580 Z" fill="#b45309" opacity="0.6" />

  <!-- Six Opposing Staves Thrusting Up from below the Ledge -->
  <g id="opposingStaves">
    <!-- Staff 1 -->
    <line x1="80" y1="700" x2="180" y2="420" stroke="url(#staffGrad)" stroke-width="14" stroke-linecap="round" />
    <circle cx="180" cy="420" r="8" fill="#22c55e" />

    <!-- Staff 2 -->
    <line x1="140" y1="720" x2="220" y2="440" stroke="url(#staffGrad)" stroke-width="14" stroke-linecap="round" />
    <circle cx="220" cy="440" r="8" fill="#22c55e" />

    <!-- Staff 3 -->
    <line x1="220" y1="740" x2="280" y2="460" stroke="url(#staffGrad)" stroke-width="14" stroke-linecap="round" />
    <circle cx="280" cy="460" r="8" fill="#22c55e" />

    <!-- Staff 4 -->
    <line x1="380" y1="740" x2="340" y2="480" stroke="url(#staffGrad)" stroke-width="14" stroke-linecap="round" />
    <circle cx="340" cy="480" r="8" fill="#22c55e" />

    <!-- Staff 5 -->
    <line x1="460" y1="720" x2="410" y2="450" stroke="url(#staffGrad)" stroke-width="14" stroke-linecap="round" />
    <circle cx="410" cy="450" r="8" fill="#22c55e" />

    <!-- Staff 6 -->
    <line x1="520" y1="700" x2="460" y2="410" stroke="url(#staffGrad)" stroke-width="14" stroke-linecap="round" />
    <circle cx="460" cy="410" r="8" fill="#22c55e" />
  </g>

  <!-- Brave Defender Standing Firm on High Ledge -->
  <g id="defenderFigure" transform="translate(240, 260)">
    <!-- Crimson Cloak/Tunic -->
    <path d="M -30 60 Q -70 140 -50 220 L 50 220 Q 70 140 30 60 Z" fill="#ea580c" filter="url(#softShadow)" />
    <!-- Tunic Inner -->
    <path d="M -20 50 L 20 50 L 25 210 L -25 210 Z" fill="#b45309" />

    <!-- Defender Head & Determined Expression -->
    <circle cx="0" cy="15" r="20" fill="#fed7aa" />
    <!-- Hair & Headband -->
    <path d="M -20 10 Q 0 -15 20 10 Q 15 25 -20 10 Z" fill="#78350f" />
    <rect x="-21" y="8" width="42" height="6" fill="#ef4444" rx="2" />

    <!-- Defensive Main Staff Held Diagonally across Body in Martial Guard -->
    <g transform="translate(0, 80)">
      <line x1="-180" y1="120" x2="180" y2="-160" stroke="url(#staffGrad)" stroke-width="16" stroke-linecap="round" filter="url(#softShadow)" />
      <!-- Sprouted Leaves on Defender Staff -->
      <path d="M 120 -100 Q 160 -120 140 -70 Z" fill="#22c55e" stroke="#15803d" stroke-width="1" />
      <path d="M -120 60 Q -160 80 -140 30 Z" fill="#22c55e" stroke="#15803d" stroke-width="1" />
      <circle cx="180" cy="-160" r="10" fill="#fef08a" filter="url(#glow)" />

      <!-- Arms Gripping Staff in Guard -->
      <line x1="-30" y1="20" x2="-60" y2="20" stroke="#fed7aa" stroke-width="12" stroke-linecap="round" />
      <line x1="30" y1="-20" x2="60" y2="-50" stroke="#fed7aa" stroke-width="12" stroke-linecap="round" />
    </g>
  </g>

  <!-- Golden Mystical Ornate Border Frame -->
  <g id="tarotBorder">
    <!-- Outer Border -->
    <rect x="16" y="16" width="568" height="768" rx="20" fill="none" stroke="url(#goldFrame)" stroke-width="6" />
    <rect x="26" y="26" width="548" height="748" rx="14" fill="none" stroke="url(#goldFrame)" stroke-width="1.5" stroke-dasharray="8,4" />

    <!-- Four Corner Filigree Scrolls -->
    <path d="M 30 60 C 30 35, 35 30, 60 30 C 45 45, 45 45, 30 60 Z" fill="url(#goldFrame)" />
    <circle cx="45" cy="45" r="4" fill="#fef08a" />
    <path d="M 570 60 C 570 35, 565 30, 540 30 C 555 45, 555 45, 570 60 Z" fill="url(#goldFrame)" />
    <circle cx="555" cy="45" r="4" fill="#fef08a" />
    <path d="M 30 740 C 30 765, 35 770, 60 770 C 45 755, 45 755, 30 740 Z" fill="url(#goldFrame)" />
    <circle cx="45" cy="755" r="4" fill="#fef08a" />
    <path d="M 570 740 C 570 765, 565 770, 540 770 C 555 755, 555 755, 570 740 Z" fill="url(#goldFrame)" />
    <circle cx="555" cy="755" r="4" fill="#fef08a" />

    <!-- Top Header Badge -->
    <g transform="translate(300, 48)">
      <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#0f172a" stroke="url(#goldFrame)" stroke-width="2" />
      <text x="0" y="5" font-family="'Cinzel', Georgia, serif" font-size="15" font-weight="bold" fill="#fef08a" text-anchor="middle" letter-spacing="2">VII • SEVEN OF WANDS</text>
    </g>

    <!-- Bottom Footer Badge -->
    <g transform="translate(300, 736)">
      <rect x="-210" y="-22" width="420" height="44" rx="22" fill="#0f172a" stroke="url(#goldFrame)" stroke-width="2" />
      <text x="0" y="-2" font-family="'Cinzel', Georgia, serif" font-size="15" font-weight="bold" fill="#fef08a" text-anchor="middle">अभय रक्षण (Defending the High Ground)</text>
      <text x="0" y="15" font-family="sans-serif" font-size="11" fill="#fdba74" text-anchor="middle" letter-spacing="1">Perseverance • Courage • Unwavering Conviction &amp; Grit</text>
    </g>
  </g>
</svg>
