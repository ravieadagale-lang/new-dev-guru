<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#052e16"/>
      <stop offset="50%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
    <linearGradient id="peridot1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bef264"/>
      <stop offset="50%" stop-color="#84cc16"/>
      <stop offset="100%" stop-color="#4d7c0f"/>
    </linearGradient>
    <linearGradient id="peridot2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a3e635"/>
      <stop offset="50%" stop-color="#65a30d"/>
      <stop offset="100%" stop-color="#3f6212"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Faceted Cushion Cut Vivid Lime-Green Peridot -->
  <g filter="url(#shadow)" transform="translate(400, 290)">
    <!-- Outer Octagonal Crown Frame -->
    <polygon points="-160,-120 160,-120 220,0 160,120 -160,120 -220,0" fill="url(#peridot1)"/>

    <!-- Brilliant Facet Triangles -->
    <polygon points="-160,-120 0,-160 160,-120 0,-60" fill="url(#peridot2)"/>
    <polygon points="160,-120 220,0 100,0 0,-60" fill="#a3e635"/>
    <polygon points="220,0 160,120 0,60 100,0" fill="url(#peridot1)"/>
    <polygon points="160,120 -160,120 0,60" fill="#4d7c0f"/>
    <polygon points="-160,120 -220,0 -100,0 0,60" fill="url(#peridot2)"/>
    <polygon points="-220,0 -160,-120 0,-60 -100,0" fill="#84cc16"/>

    <!-- Central Table Facet -->
    <polygon points="-100,-60 100,-60 140,0 100,60 -100,60 -140,0" fill="#d9f99d"/>

    <!-- Double Refraction Sparkle Lines -->
    <polygon points="-100,-60 0,-60 -20,0 -100,-60" fill="url(#shine)"/>
    <circle cx="-40" cy="-30" r="8" fill="#ffffff" opacity="0.95"/>
    <circle cx="80" cy="20" r="5" fill="#fef08a" opacity="0.9"/>
  </g>

  <!-- Label Badge -->
  <rect x="220" y="520" width="360" height="44" rx="22" fill="#052e16" stroke="#84cc16" stroke-width="1.5"/>
  <text x="400" y="548" font-family="Cinzel, Georgia, serif" font-size="18" font-weight="bold" fill="#ecfccb" text-anchor="middle">
    VIVID PERIDOT (ज़बरजद)
  </text>
</svg>
