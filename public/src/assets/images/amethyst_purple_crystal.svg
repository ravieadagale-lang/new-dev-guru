<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#311042"/>
      <stop offset="100%" stop-color="#090514"/>
    </linearGradient>
    <linearGradient id="amy1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#581c87"/>
    </linearGradient>
    <linearGradient id="amy2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e9d5ff"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Royal Violet Amethyst Geode Cluster -->
  <g filter="url(#shadow)" transform="translate(400, 280)">
    <!-- Main Center Crystal Point -->
    <polygon points="0,-180 -90,-40 0,20" fill="url(#amy2)"/>
    <polygon points="0,-180 0,20 90,-40" fill="url(#amy1)"/>
    <polygon points="-90,-40 0,20 0,180 -80,140" fill="#581c87"/>
    <polygon points="0,20 90,-40 80,140 0,180" fill="#3b0764"/>

    <!-- Side Crystal Point Left -->
    <polygon points="-120,-110 -170,-20 -100,20" fill="url(#amy1)"/>
    <polygon points="-120,-110 -100,20 -60,-20" fill="#a855f7"/>
    <polygon points="-170,-20 -100,20 -90,130 -150,90" fill="#3b0764"/>

    <!-- Side Crystal Point Right -->
    <polygon points="120,-110 60,-20 100,20" fill="url(#amy2)"/>
    <polygon points="120,-110 100,20 170,-20" fill="#c084fc"/>
    <polygon points="100,20 170,-20 150,90 90,130" fill="#581c87"/>

    <!-- Specular Facet Highlights -->
    <polygon points="0,-180 15,-30 0,20" fill="url(#shine)"/>
    <polygon points="-120,-110 -110,-10 -100,20" fill="url(#shine)"/>
    <circle cx="20" cy="-20" r="6" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Label Badge -->
  <rect x="220" y="520" width="360" height="44" rx="22" fill="#1e1b4b" stroke="#a855f7" stroke-width="1.5"/>
  <text x="400" y="548" font-family="Cinzel, Georgia, serif" font-size="18" font-weight="bold" fill="#f3e8ff" text-anchor="middle">
    ROYAL AMETHYST (कटैला / जामुनिया)
  </text>
</svg>
