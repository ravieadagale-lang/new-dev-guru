<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <!-- Studio Deep Violet Ambient Lighting Background -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#f3e8ff"/>
      <stop offset="50%" stop-color="#e9d5ff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </radialGradient>

    <!-- Marble Slab Surface Gradient -->
    <linearGradient id="marbleBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#f5f3ff"/>
      <stop offset="70%" stop-color="#e7e5e4"/>
      <stop offset="100%" stop-color="#d6d3d1"/>
    </linearGradient>

    <!-- Deep Purple Amethyst Facet Gradients -->
    <linearGradient id="facetDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7e22ce"/>
      <stop offset="50%" stop-color="#581c87"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </linearGradient>

    <linearGradient id="facetMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#7e22ce"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>

    <linearGradient id="facetBright" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e9d5ff"/>
      <stop offset="40%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="studioShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22"/>
      <feOffset dx="0" dy="26" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.42"/>
      </feComponentTransfer>
      <feMerge> 
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="purpleGlow">
      <feGaussianBlur stdDeviation="12" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Studio Background -->
  <rect width="1200" height="800" fill="url(#bgGrad)"/>

  <!-- Ambient Bokeh Circles -->
  <g opacity="0.35">
    <circle cx="200" cy="180" r="140" fill="#d8b4fe" filter="url(#purpleGlow)"/>
    <circle cx="1000" cy="220" r="160" fill="#a855f7" filter="url(#purpleGlow)"/>
    <circle cx="850" cy="120" r="90" fill="#f3e8ff" filter="url(#purpleGlow)"/>
  </g>

  <!-- Marble Slab Pedestal -->
  <g>
    <!-- Shadow -->
    <path d="M 150 560 L 1050 560 L 980 720 L 220 720 Z" fill="#000000" opacity="0.18" filter="url(#purpleGlow)"/>
    
    <!-- Top Surface -->
    <path d="M 180 540 L 1020 540 L 950 680 L 250 680 Z" fill="url(#marbleBase)"/>
    <!-- Marble Veins -->
    <path d="M 290 555 Q 440 615, 610 580 T 880 635" fill="none" stroke="#a855f7" stroke-width="1.8" opacity="0.2"/>
    <path d="M 360 540 Q 500 570, 740 545" fill="none" stroke="#78716c" stroke-width="1.5" opacity="0.25"/>
    
    <!-- Front Edge -->
    <path d="M 250 680 L 950 680 L 930 710 L 270 710 Z" fill="#a8a29e"/>
  </g>

  <!-- Natural Green Moss Framing Base -->
  <g opacity="0.85">
    <path d="M 180 560 Q 230 495, 280 535 Q 320 485, 370 545 Z" fill="#14532d"/>
    <path d="M 200 550 Q 240 505, 270 540" fill="#22c55e" opacity="0.85"/>
    <path d="M 830 545 Q 890 485, 940 535 Q 980 475, 1020 555 Z" fill="#064e3b"/>
    <path d="M 860 535 Q 900 495, 940 530" fill="#10b981" opacity="0.75"/>
  </g>

  <!-- Main Crystalline Amethyst Cluster -->
  <g filter="url(#studioShadow)">
    <!-- Base Shadow -->
    <ellipse cx="600" cy="535" rx="240" ry="55" fill="#000000" opacity="0.38"/>
    
    <!-- Amethyst Crystal Cluster Facets -->
    <!-- Central Main Point -->
    <polygon points="560,510 630,510 660,330 600,190 530,320" fill="url(#facetMid)"/>
    <polygon points="600,190 660,330 630,510 580,510" fill="url(#facetDark)"/>
    <polygon points="600,190 530,320 560,510" fill="url(#facetBright)"/>
    <polygon points="600,190 560,250 610,260" fill="#ffffff" opacity="0.7"/>

    <!-- Left Point -->
    <polygon points="460,510 530,510 550,360 500,240 440,350" fill="url(#facetMid)"/>
    <polygon points="500,240 550,360 530,510 490,510" fill="url(#facetDark)"/>
    <polygon points="500,240 440,350 460,510" fill="url(#facetBright)"/>
    <polygon points="500,240 470,290 510,295" fill="#ffffff" opacity="0.65"/>

    <!-- Right Point -->
    <polygon points="660,510 730,510 750,380 710,270 650,370" fill="url(#facetMid)"/>
    <polygon points="710,270 750,380 730,510 690,510" fill="url(#facetDark)"/>
    <polygon points="710,270 650,370 660,510" fill="url(#facetBright)"/>
    <polygon points="710,270 680,310 720,315" fill="#ffffff" opacity="0.65"/>

    <!-- Side Mini Points -->
    <polygon points="400,510 460,510 475,410 440,320 390,410" fill="url(#facetMid)"/>
    <polygon points="440,320 475,410 460,510" fill="url(#facetDark)"/>
    <polygon points="440,320 390,410 400,510" fill="url(#facetBright)"/>

    <polygon points="730,510 790,510 800,420 770,340 720,420" fill="url(#facetMid)"/>
    <polygon points="770,340 800,420 790,510" fill="url(#facetDark)"/>
    <polygon points="770,340 720,420 730,510" fill="url(#facetBright)"/>

    <!-- Sparkle Specular Highlights -->
    <circle cx="600" cy="190" r="10" fill="#ffffff" opacity="0.9" filter="url(#purpleGlow)"/>
    <circle cx="500" cy="240" r="8" fill="#ffffff" opacity="0.85" filter="url(#purpleGlow)"/>
    <circle cx="710" cy="270" r="8" fill="#ffffff" opacity="0.85" filter="url(#purpleGlow)"/>
  </g>

  <!-- Luxury Royal Gold Badge -->
  <g transform="translate(600, 730)">
    <rect x="-220" y="-22" width="440" height="44" rx="22" fill="#3b0764" stroke="#c084fc" stroke-width="2"/>
    <text x="0" y="6" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="20" font-weight="bold" fill="#f3e8ff" text-anchor="middle" letter-spacing="2">
      ROYAL AMETHYST • (कटैला / जामुनिया)
    </text>
  </g>
</svg>
