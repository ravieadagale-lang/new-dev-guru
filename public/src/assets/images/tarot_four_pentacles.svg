<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="earthBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061a12" />
      <stop offset="50%" stop-color="#113826" />
      <stop offset="100%" stop-color="#04120c" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
  </defs>

  <rect width="600" height="800" fill="url(#earthBg)" rx="24" />

  <!-- Stars & Emerald Sparkles -->
  <circle cx="100" cy="110" r="2.5" fill="#fef08a" opacity="0.9" />
  <circle cx="480" cy="140" r="3" fill="#4ade80" opacity="0.8" />

  <!-- Frame -->
  <rect x="20" y="20" width="560" height="760" fill="none" stroke="url(#goldGrad)" stroke-width="6" rx="16" />
  <rect x="30" y="30" width="540" height="740" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="8,4" rx="12" />

  <!-- Title Badge -->
  <rect x="130" y="45" width="340" height="40" fill="#061a12" stroke="url(#goldGrad)" stroke-width="2" rx="20" />
  <text x="300" y="71" font-family="'Cinzel', Georgia, serif" font-size="18" font-weight="bold" fill="#fef08a" text-anchor="middle" letter-spacing="2">IV - FOUR OF PENTACLES</text>

  <!-- Crown and 4 Pentacles -->
  <g transform="translate(300, 390)">
    <!-- Throne Pedestal -->
    <path d="M -100,160 L 100,160 L 80,110 L -80,110 Z" fill="#061a12" stroke="url(#goldGrad)" stroke-width="2" />
    
    <!-- Crown Coin (Head) -->
    <g transform="translate(0, -150)">
      <circle cx="0" cy="0" r="38" fill="url(#goldGrad)" />
      <circle cx="0" cy="0" r="30" fill="none" stroke="#061a12" stroke-width="2" />
      <polygon points="0,-24 7,-8 24,-8 11,2 16,18 0,8 -16,18 -11,2 -24,-8 -7,-8" fill="#061a12" />
    </g>

    <!-- Chest Coin (Heart) -->
    <g transform="translate(0, -30)">
      <circle cx="0" cy="0" r="50" fill="url(#goldGrad)" />
      <circle cx="0" cy="0" r="42" fill="none" stroke="#061a12" stroke-width="2.5" />
      <polygon points="0,-35 10,-11 35,-11 16,3 23,26 0,12 -23,26 -16,3 -35,-11 -10,-11" fill="#061a12" />
    </g>

    <!-- Left Foot Coin -->
    <g transform="translate(-75, 90)">
      <circle cx="0" cy="0" r="38" fill="url(#goldGrad)" />
      <circle cx="0" cy="0" r="30" fill="none" stroke="#061a12" stroke-width="2" />
      <polygon points="0,-24 7,-8 24,-8 11,2 16,18 0,8 -16,18 -11,2 -24,-8 -7,-8" fill="#061a12" />
    </g>

    <!-- Right Foot Coin -->
    <g transform="translate(75, 90)">
      <circle cx="0" cy="0" r="38" fill="url(#goldGrad)" />
      <circle cx="0" cy="0" r="30" fill="none" stroke="#061a12" stroke-width="2" />
      <polygon points="0,-24 7,-8 24,-8 11,2 16,18 0,8 -16,18 -11,2 -24,-8 -7,-8" fill="#061a12" />
    </g>
  </g>

  <!-- Sanskrit Title -->
  <text x="300" y="720" font-family="sans-serif" font-size="16" fill="#fef08a" text-anchor="middle" opacity="0.9">कोष रक्षण (Conservation & Financial Stability)</text>
</svg>
