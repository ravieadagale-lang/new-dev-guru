<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="35%" stop-color="#78350f" />
      <stop offset="65%" stop-color="#c2410c" />
      <stop offset="85%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <linearGradient id="goldFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="20%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="80%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <linearGradient id="staffGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="40%" stop-color="#fde047" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>

    <linearGradient id="desertGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feOffset dx="2" dy="4" result="offset" />
      <feComposite in="SourceGraphic" in2="offset" operator="over" />
    </filter>
  </defs>

  <!-- Background Sky -->
  <rect width="600" height="800" fill="url(#skyGrad)" rx="24" />

  <!-- Pyramidal Desert Peaks in Background -->
  <polygon points="40,520 180,340 320,520" fill="#78350f" opacity="0.8" />
  <polygon points="260,520 380,380 500,520" fill="#92400e" opacity="0.9" />

  <!-- Desert Dunes Terrain -->
  <path d="M 0 520 Q 300 480 600 520 L 600 800 L 0 800 Z" fill="url(#desertGrad)" />

  <!-- Page of Wands Standing Figure -->
  <g id="pageFigure" transform="translate(270, 240)">
    <!-- Yellow Tunic patterned with Flame & Salamander Emblems -->
    <path d="M -30 60 Q -70 150 -50 250 L 50 250 Q 70 150 30 60 Z" fill="#eab308" filter="url(#softShadow)" />
    <path d="M -20 50 L 20 50 L 25 240 L -25 240 Z" fill="#ca8a04" />

    <!-- Salamander / Flame Motifs on Tunic -->
    <path d="M -15 100 Q -5 90 0 110 T 15 100" fill="none" stroke="#78350f" stroke-width="3" />
    <path d="M -15 150 Q -5 140 0 160 T 15 150" fill="none" stroke="#78350f" stroke-width="3" />
    <path d="M -15 200 Q -5 190 0 210 T 15 200" fill="none" stroke="#78350f" stroke-width="3" />

    <!-- Page Head & Profile (Gazing upward at wand top) -->
    <circle cx="0" cy="10" r="22" fill="#fed7aa" />

    <!-- Cap with Fiery Red Feather -->
    <path d="M -22 5 Q 0 -20 22 5 Z" fill="#991b1b" />
    <!-- Flaming Feather -->
    <path d="M 10 -5 Q 30 -40 15 -60 Q 5 -30 10 -5 Z" fill="#ef4444" filter="url(#glow)" />

    <!-- Tall Blooming Wand Held with both hands -->
    <g transform="translate(40, -40)">
      <rect x="-8" y="-120" width="16" height="460" rx="8" fill="url(#staffGrad)" filter="url(#softShadow)" />
      <circle cx="0" cy="-120" r="12" fill="#fef08a" filter="url(#glow)" />

      <!-- Sprouted Fresh Emerald Leaves Blooming at top -->
      <path d="M 8 -90 Q 40 -110 20 -60 Z" fill="#22c55e" stroke="#15803d" stroke-width="1" />
      <path d="M -8 -70 Q -40 -90 -20 -40 Z" fill="#22c55e" stroke="#15803d" stroke-width="1" />
      <path d="M 8 -30 Q 40 -50 20 0 Z" fill="#22c55e" stroke="#15803d" stroke-width="1" />
      <path d="M -8 -10 Q -40 -30 -20 20 Z" fill="#22c55e" stroke="#15803d" stroke-width="1" />
    </g>

    <!-- Arms Holding Staff -->
    <line x1="-10" y1="50" x2="32" y2="50" stroke="#fed7aa" stroke-width="12" stroke-linecap="round" />
  </g>

  <!-- Golden Mystical Ornate Border Frame -->
  <g id="tarotBorder">
    <!-- Outer Border -->
    <rect x="16" y="16" width="568" height="768" rx="20" fill="none" stroke="url(#goldFrame)" stroke-width="6" />
    <rect x="26" y="26" width="548" height="748" rx="14" fill="none" stroke="url(#goldFrame)" stroke-width="1.5" stroke-dasharray="8,4" />

    <!-- Four Corner Filigree Scrolls -->
    <path d="M 30 60 C 30 35, 35 30, 60 30 C 45 45, 45 45, 30 60 Z" fill="url(#goldFrame)" />
    <circle cx="45" cy="45" r="4" fill="#fef08a" />
    <path d="M 570 60 C 570 35, 565 30, 540 30 C 555 45, 555 45, 570 60 Z" fill="url(#goldFrame)" />
    <circle cx="555" cy="45" r="4" fill="#fef08a" />
    <path d="M 30 740 C 30 765, 35 770, 60 770 C 45 755, 45 755, 30 740 Z" fill="url(#goldFrame)" />
    <circle cx="45" cy="755" r="4" fill="#fef08a" />
    <path d="M 570 740 C 570 765, 565 770, 540 770 C 555 755, 555 755, 570 740 Z" fill="url(#goldFrame)" />
    <circle cx="555" cy="755" r="4" fill="#fef08a" />

    <!-- Top Header Badge -->
    <g transform="translate(300, 48)">
      <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#0f172a" stroke="url(#goldFrame)" stroke-width="2" />
      <text x="0" y="5" font-family="'Cinzel', Georgia, serif" font-size="15" font-weight="bold" fill="#fef08a" text-anchor="middle" letter-spacing="2">PAGE OF WANDS</text>
    </g>

    <!-- Bottom Footer Badge -->
    <g transform="translate(300, 736)">
      <rect x="-210" y="-22" width="420" height="44" rx="22" fill="#0f172a" stroke="url(#goldFrame)" stroke-width="2" />
      <text x="0" y="-2" font-family="'Cinzel', Georgia, serif" font-size="15" font-weight="bold" fill="#fef08a" text-anchor="middle">प्रेरणा दूत (Inspirational Messenger)</text>
      <text x="0" y="15" font-family="sans-serif" font-size="11" fill="#fdba74" text-anchor="middle" letter-spacing="1">Free Spirit • Creative Spark • Discovery &amp; Enthusiasm</text>
    </g>
  </g>
</svg>
