<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="30%" stop-color="#78350f" />
      <stop offset="60%" stop-color="#b45309" />
      <stop offset="85%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <linearGradient id="goldFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="20%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="80%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <linearGradient id="staffGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="40%" stop-color="#fde047" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>

    <linearGradient id="castleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>

    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#fef08a" stop-opacity="0.6" />
      <stop offset="80%" stop-color="#f59e0b" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#78350f" stop-opacity="0" />
    </radialGradient>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feOffset dx="2" dy="4" result="offset" />
      <feComposite in="SourceGraphic" in2="offset" operator="over" />
    </filter>
  </defs>

  <!-- Background Sky -->
  <rect width="600" height="800" fill="url(#skyGrad)" rx="24" />

  <!-- Sun Radiance Aura -->
  <circle cx="300" cy="260" r="220" fill="url(#sunGlow)" />

  <!-- Golden Castle Estate in Background -->
  <g id="backgroundCastle" opacity="0.85">
    <!-- Castle Walls & Towers -->
    <path d="M 120 480 L 120 340 L 160 300 L 200 340 L 200 480 Z" fill="url(#castleGrad)" />
    <path d="M 160 300 L 160 250 L 180 270 L 140 270 Z" fill="#fef08a" />
    <!-- Main Keep -->
    <path d="M 200 480 L 200 300 L 400 300 L 400 480 Z" fill="url(#castleGrad)" />
    <!-- Crenellations -->
    <path d="M 200 300 L 220 300 L 220 310 L 240 310 L 240 300 L 260 300 L 260 310 L 280 310 L 280 300 L 300 300 L 300 310 L 320 310 L 320 300 L 340 300 L 340 310 L 360 310 L 360 300 L 380 300 L 380 310 L 400 310 L 400 480 L 200 480 Z" fill="#a16207" />
    <!-- Right Tower -->
    <path d="M 400 480 L 400 340 L 440 300 L 480 340 L 480 480 Z" fill="url(#castleGrad)" />

    <!-- Arched Castle Gate -->
    <path d="M 270 480 C 270 410, 330 410, 330 480 Z" fill="#451a03" />
  </g>

  <!-- Green Grass Horizon Hill -->
  <path d="M 0 460 Q 300 420 600 460 L 600 800 L 0 800 Z" fill="#15803d" />
  <path d="M 0 480 Q 300 450 600 480 L 600 800 L 0 800 Z" fill="#166534" />

  <!-- Four Sprouted Staves Arbor Gateway Pillars -->
  <g id="fourStaves">
    <!-- Staff 1 (Far Left) -->
    <rect x="80" y="160" width="16" height="420" rx="8" fill="url(#staffGrad)" filter="url(#softShadow)" />
    <circle cx="88" cy="160" r="10" fill="#fef08a" filter="url(#glow)" />

    <!-- Staff 2 (Inner Left) -->
    <rect x="160" y="140" width="16" height="440" rx="8" fill="url(#staffGrad)" filter="url(#softShadow)" />
    <circle cx="168" cy="140" r="10" fill="#fef08a" filter="url(#glow)" />

    <!-- Staff 3 (Inner Right) -->
    <rect x="424" y="140" width="16" height="440" rx="8" fill="url(#staffGrad)" filter="url(#softShadow)" />
    <circle cx="432" cy="140" r="10" fill="#fef08a" filter="url(#glow)" />

    <!-- Staff 4 (Far Right) -->
    <rect x="504" y="160" width="16" height="420" rx="8" fill="url(#staffGrad)" filter="url(#softShadow)" />
    <circle cx="512" cy="160" r="10" fill="#fef08a" filter="url(#glow)" />
  </g>

  <!-- Festive Floral Garland & Vines draped across all four wands -->
  <g id="floralGarland">
    <!-- Main Green Vine Canopy -->
    <path d="M 80 200 Q 120 240 160 210 Q 292 160 424 210 Q 464 240 512 200" fill="none" stroke="#22c55e" stroke-width="20" stroke-linecap="round" />
    <path d="M 80 200 Q 120 240 160 210 Q 292 160 424 210 Q 464 240 512 200" fill="none" stroke="#15803d" stroke-width="12" stroke-linecap="round" />

    <!-- Draped Lower Garland Loop -->
    <path d="M 160 210 Q 292 310 424 210" fill="none" stroke="#16a34a" stroke-width="14" stroke-linecap="round" />

    <!-- Red & Yellow Roses, Fruits, and Flowers along Garlands -->
    <!-- Left Cluster -->
    <circle cx="120" cy="220" r="12" fill="#ef4444" />
    <circle cx="130" cy="210" r="8" fill="#fef08a" />
    <circle cx="160" cy="210" r="14" fill="#ef4444" />
    <circle cx="170" cy="225" r="9" fill="#f97316" />

    <!-- Center Garland Loop Flowers -->
    <circle cx="210" cy="245" r="10" fill="#fef08a" />
    <circle cx="250" cy="260" r="12" fill="#ef4444" />
    <circle cx="292" cy="265" r="15" fill="#f97316" filter="url(#glow)" />
    <circle cx="292" cy="265" r="7" fill="#fef08a" />
    <circle cx="334" cy="260" r="12" fill="#ef4444" />
    <circle cx="374" cy="245" r="10" fill="#fef08a" />

    <!-- Right Cluster -->
    <circle cx="424" cy="210" r="14" fill="#ef4444" />
    <circle cx="414" cy="225" r="9" fill="#f97316" />
    <circle cx="470" cy="220" r="12" fill="#ef4444" />
    <circle cx="480" cy="210" r="8" fill="#fef08a" />
  </g>

  <!-- Celebrating Figures Waving Bouquets in Foreground -->
  <g id="celebratingFigures" transform="translate(0, 30)">
    <!-- Maiden 1 (Left, White Robe with Red Cloak) -->
    <g transform="translate(230, 360)">
      <!-- White Robe -->
      <path d="M -25 40 Q 0 20 25 40 L 35 150 L -35 150 Z" fill="#f8fafc" filter="url(#softShadow)" />
      <!-- Red Cloak -->
      <path d="M -20 40 L 20 40 L 25 140 L -25 140 Z" fill="#dc2626" opacity="0.8" />
      <!-- Head & Hair -->
      <circle cx="0" cy="10" r="18" fill="#fed7aa" />
      <!-- Floral Wreath Crown -->
      <circle cx="0" cy="0" r="16" fill="none" stroke="#22c55e" stroke-width="4" stroke-dasharray="6,3" />
      <!-- Raised Arm with Flower Bouquet -->
      <line x1="-10" y1="50" x2="-35" y2="10" stroke="#fed7aa" stroke-width="8" stroke-linecap="round" />
      <circle cx="-40" cy="0" r="14" fill="#ef4444" />
      <circle cx="-45" cy="-5" r="8" fill="#fef08a" />
    </g>

    <!-- Maiden 2 (Right, White Robe with Blue Cloak) -->
    <g transform="translate(370, 360)">
      <!-- White Robe -->
      <path d="M -25 40 Q 0 20 25 40 L 35 150 L -35 150 Z" fill="#f8fafc" filter="url(#softShadow)" />
      <!-- Blue Cloak -->
      <path d="M -20 40 L 20 40 L 25 140 L -25 140 Z" fill="#2563eb" opacity="0.8" />
      <!-- Head & Hair -->
      <circle cx="0" cy="10" r="18" fill="#fed7aa" />
      <!-- Floral Wreath Crown -->
      <circle cx="0" cy="0" r="16" fill="none" stroke="#22c55e" stroke-width="4" stroke-dasharray="6,3" />
      <!-- Raised Arm with Flower Bouquet -->
      <line x1="10" y1="50" x2="35" y2="10" stroke="#fed7aa" stroke-width="8" stroke-linecap="round" />
      <circle cx="40" cy="0" r="14" fill="#fef08a" />
      <circle cx="45" cy="-5" r="8" fill="#f97316" />
    </g>
  </g>

  <!-- Golden Mystical Ornate Border Frame -->
  <g id="tarotBorder">
    <!-- Outer Border -->
    <rect x="16" y="16" width="568" height="768" rx="20" fill="none" stroke="url(#goldFrame)" stroke-width="6" />
    <rect x="26" y="26" width="548" height="748" rx="14" fill="none" stroke="url(#goldFrame)" stroke-width="1.5" stroke-dasharray="8,4" />

    <!-- Four Corner Filigree Scrolls -->
    <path d="M 30 60 C 30 35, 35 30, 60 30 C 45 45, 45 45, 30 60 Z" fill="url(#goldFrame)" />
    <circle cx="45" cy="45" r="4" fill="#fef08a" />
    <path d="M 570 60 C 570 35, 565 30, 540 30 C 555 45, 555 45, 570 60 Z" fill="url(#goldFrame)" />
    <circle cx="555" cy="45" r="4" fill="#fef08a" />
    <path d="M 30 740 C 30 765, 35 770, 60 770 C 45 755, 45 755, 30 740 Z" fill="url(#goldFrame)" />
    <circle cx="45" cy="755" r="4" fill="#fef08a" />
    <path d="M 570 740 C 570 765, 565 770, 540 770 C 555 755, 555 755, 570 740 Z" fill="url(#goldFrame)" />
    <circle cx="555" cy="755" r="4" fill="#fef08a" />

    <!-- Top Header Badge -->
    <g transform="translate(300, 48)">
      <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#0f172a" stroke="url(#goldFrame)" stroke-width="2" />
      <text x="0" y="5" font-family="'Cinzel', Georgia, serif" font-size="15" font-weight="bold" fill="#fef08a" text-anchor="middle" letter-spacing="2">IV • FOUR OF WANDS</text>
    </g>

    <!-- Bottom Footer Badge -->
    <g transform="translate(300, 736)">
      <rect x="-210" y="-22" width="420" height="44" rx="22" fill="#0f172a" stroke="url(#goldFrame)" stroke-width="2" />
      <text x="0" y="-2" font-family="'Cinzel', Georgia, serif" font-size="15" font-weight="bold" fill="#fef08a" text-anchor="middle">गृह आनंद (Sacred Sanctuary)</text>
      <text x="0" y="15" font-family="sans-serif" font-size="11" fill="#fdba74" text-anchor="middle" letter-spacing="1">Homecoming • Harmony • Celebration &amp; Milestone</text>
    </g>
  </g>
</svg>
