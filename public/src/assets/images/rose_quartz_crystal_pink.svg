<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c0519"/>
      <stop offset="50%" stop-color="#881337"/>
      <stop offset="100%" stop-color="#2a020d"/>
    </linearGradient>
    <radialGradient id="roseGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffe4e6"/>
      <stop offset="35%" stop-color="#fecdd3"/>
      <stop offset="70%" stop-color="#fda4af"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </radialGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="50%" y2="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Translucent Blush Pink Rose Quartz Raw Nugget -->
  <g filter="url(#shadow)">
    <path d="M 290 190 C 420 130, 560 170, 590 290 C 610 410, 470 490, 340 470 C 220 450, 190 310, 290 190 Z" fill="url(#roseGrad)"/>
  </g>

  <!-- Internal Soft Crystalline Veil & Fractures -->
  <path d="M 310 240 Q 400 290, 480 250" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.4"/>
  <path d="M 360 310 Q 430 360, 520 320" fill="none" stroke="#fff1f2" stroke-width="2.5" opacity="0.35"/>
  <path d="M 280 340 Q 350 390, 420 380" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.5"/>

  <!-- High Gloss Polish Highlight -->
  <path d="M 320 200 C 410 160, 480 185, 520 235 C 460 225, 380 215, 320 200 Z" fill="url(#shine)"/>
  <circle cx="340" cy="195" r="11" fill="#ffffff" opacity="0.9"/>

  <!-- Label Badge -->
  <rect x="220" y="520" width="360" height="44" rx="22" fill="#4c0519" stroke="#fb7185" stroke-width="1.5"/>
  <text x="400" y="548" font-family="Cinzel, Georgia, serif" font-size="18" font-weight="bold" fill="#ffe4e6" text-anchor="middle">
    ROSE QUARTZ (गुलाबी स्फटिक)
  </text>
</svg>
