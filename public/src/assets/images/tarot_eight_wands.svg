<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <!-- Clear Blue Sky Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="35%" stop-color="#0284c7" />
      <stop offset="65%" stop-color="#38bdf8" />
      <stop offset="85%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>

    <linearGradient id="goldFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="20%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="80%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <linearGradient id="staffGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="40%" stop-color="#fde047" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>

    <linearGradient id="riverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1e3a5f" />
    </linearGradient>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feOffset dx="3" dy="5" result="offset" />
      <feComposite in="SourceGraphic" in2="offset" operator="over" />
    </filter>
  </defs>

  <!-- Background Sky -->
  <rect width="600" height="800" fill="url(#skyGrad)" rx="24" />

  <!-- Tranquil Rolling Hills Landscape at Bottom -->
  <path d="M 0 540 Q 200 480 400 520 T 600 500 L 600 800 L 0 800 Z" fill="#15803d" />
  <path d="M 0 580 Q 250 520 500 560 L 600 540 L 600 800 L 0 800 Z" fill="#166534" />

  <!-- Winding River -->
  <path d="M -50 780 C 100 700, 200 600, 350 620 C 450 630, 520 580, 650 560 L 650 660 C 500 680, 400 720, 250 700 C 100 680, 0 800, -50 800 Z" fill="url(#riverGrad)" opacity="0.9" />

  <!-- Distant Hilltop Castle -->
  <g transform="translate(420, 460)" opacity="0.85">
    <path d="M 0 40 L 0 10 L 20 0 L 40 10 L 40 40 Z" fill="#a16207" />
    <path d="M 40 40 L 40 20 L 70 20 L 70 40 Z" fill="#854d0e" />
  </g>

  <!-- Speed Motion Trails behind Flying Wands -->
  <g stroke="#ffffff" stroke-width="2" stroke-dasharray="10,8" opacity="0.75" transform="translate(-30, -30)">
    <line x1="50" y1="120" x2="350" y2="280" />
    <line x1="80" y1="150" x2="380" y2="310" />
    <line x1="110" y1="180" x2="410" y2="340" />
    <line x1="140" y1="210" x2="440" y2="370" />
    <line x1="170" y1="240" x2="470" y2="400" />
    <line x1="200" y1="270" x2="500" y2="430" />
    <line x1="230" y1="300" x2="530" y2="460" />
    <line x1="260" y1="330" x2="560" y2="490" />
  </g>

  <!-- Eight Parallel Sprouted Wands Flying Swiftly Across Sky -->
  <g id="eightFlyingWands">
    <!-- Wand 1 (Top Left) -->
    <g transform="translate(60, 110)">
      <line x1="0" y1="0" x2="360" y2="190" stroke="url(#staffGrad)" stroke-width="12" stroke-linecap="round" filter="url(#softShadow)" />
      <path d="M 320 170 Q 360 150 340 200 Z" fill="#22c55e" stroke="#15803d" stroke-width="1" />
      <circle cx="360" cy="190" r="8" fill="#fef08a" filter="url(#glow)" />
    </g>

    <!-- Wand 2 -->
    <g transform="translate(85, 145)">
      <line x1="0" y1="0" x2="360" y2="190" stroke="url(#staffGrad)" stroke-width="12" stroke-linecap="round" filter="url(#softShadow)" />
      <path d="M 320 170 Q 360 150 340 200 Z" fill="#22c55e" stroke="#15803d" stroke-width="1" />
      <circle cx="360" cy="190" r="8" fill="#fef08a" filter="url(#glow)" />
    </g>

    <!-- Wand 3 -->
    <g transform="translate(110, 180)">
      <line x1="0" y1="0" x2="360" y2="190" stroke="url(#staffGrad)" stroke-width="12" stroke-linecap="round" filter="url(#softShadow)" />
      <path d="M 320 170 Q 360 150 340 200 Z" fill="#22c55e" stroke="#15803d" stroke-width="1" />
      <circle cx="360" cy="190" r="8" fill="#fef08a" filter="url(#glow)" />
    </g>

    <!-- Wand 4 -->
    <g transform="translate(135, 215)">
      <line x1="0" y1="0" x2="360" y2="190" stroke="url(#staffGrad)" stroke-width="12" stroke-linecap="round" filter="url(#softShadow)" />
      <path d="M 320 170 Q 360 150 340 200 Z" fill="#22c55e" stroke="#15803d" stroke-width="1" />
      <circle cx="360" cy="190" r="8" fill="#fef08a" filter="url(#glow)" />
    </g>

    <!-- Wand 5 -->
    <g transform="translate(160, 250)">
      <line x1="0" y1="0" x2="360" y2="190" stroke="url(#staffGrad)" stroke-width="12" stroke-linecap="round" filter="url(#softShadow)" />
      <path d="M 320 170 Q 360 150 340 200 Z" fill="#22c55e" stroke="#15803d" stroke-width="1" />
      <circle cx="360" cy="190" r="8" fill="#fef08a" filter="url(#glow)" />
    </g>

    <!-- Wand 6 -->
    <g transform="translate(185, 285)">
      <line x1="0" y1="0" x2="360" y2="190" stroke="url(#staffGrad)" stroke-width="12" stroke-linecap="round" filter="url(#softShadow)" />
      <path d="M 320 170 Q 360 150 340 200 Z" fill="#22c55e" stroke="#15803d" stroke-width="1" />
      <circle cx="360" cy="190" r="8" fill="#fef08a" filter="url(#glow)" />
    </g>

    <!-- Wand 7 -->
    <g transform="translate(210, 320)">
      <line x1="0" y1="0" x2="360" y2="190" stroke="url(#staffGrad)" stroke-width="12" stroke-linecap="round" filter="url(#softShadow)" />
      <path d="M 320 170 Q 360 150 340 200 Z" fill="#22c55e" stroke="#15803d" stroke-width="1" />
      <circle cx="360" cy="190" r="8" fill="#fef08a" filter="url(#glow)" />
    </g>

    <!-- Wand 8 (Bottom Right) -->
    <g transform="translate(235, 355)">
      <line x1="0" y1="0" x2="360" y2="190" stroke="url(#staffGrad)" stroke-width="12" stroke-linecap="round" filter="url(#softShadow)" />
      <path d="M 320 170 Q 360 150 340 200 Z" fill="#22c55e" stroke="#15803d" stroke-width="1" />
      <circle cx="360" cy="190" r="8" fill="#fef08a" filter="url(#glow)" />
    </g>
  </g>

  <!-- Golden Mystical Ornate Border Frame -->
  <g id="tarotBorder">
    <!-- Outer Border -->
    <rect x="16" y="16" width="568" height="768" rx="20" fill="none" stroke="url(#goldFrame)" stroke-width="6" />
    <rect x="26" y="26" width="548" height="748" rx="14" fill="none" stroke="url(#goldFrame)" stroke-width="1.5" stroke-dasharray="8,4" />

    <!-- Four Corner Filigree Scrolls -->
    <path d="M 30 60 C 30 35, 35 30, 60 30 C 45 45, 45 45, 30 60 Z" fill="url(#goldFrame)" />
    <circle cx="45" cy="45" r="4" fill="#fef08a" />
    <path d="M 570 60 C 570 35, 565 30, 540 30 C 555 45, 555 45, 570 60 Z" fill="url(#goldFrame)" />
    <circle cx="555" cy="45" r="4" fill="#fef08a" />
    <path d="M 30 740 C 30 765, 35 770, 60 770 C 45 755, 45 755, 30 740 Z" fill="url(#goldFrame)" />
    <circle cx="45" cy="755" r="4" fill="#fef08a" />
    <path d="M 570 740 C 570 765, 565 770, 540 770 C 555 755, 555 755, 570 740 Z" fill="url(#goldFrame)" />
    <circle cx="555" cy="755" r="4" fill="#fef08a" />

    <!-- Top Header Badge -->
    <g transform="translate(300, 48)">
      <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#0f172a" stroke="url(#goldFrame)" stroke-width="2" />
      <text x="0" y="5" font-family="'Cinzel', Georgia, serif" font-size="15" font-weight="bold" fill="#fef08a" text-anchor="middle" letter-spacing="2">VIII • EIGHT OF WANDS</text>
    </g>

    <!-- Bottom Footer Badge -->
    <g transform="translate(300, 736)">
      <rect x="-210" y="-22" width="420" height="44" rx="22" fill="#0f172a" stroke="url(#goldFrame)" stroke-width="2" />
      <text x="0" y="-2" font-family="'Cinzel', Georgia, serif" font-size="15" font-weight="bold" fill="#fef08a" text-anchor="middle">शीघ्र गति (Rapid Acceleration)</text>
      <text x="0" y="15" font-family="sans-serif" font-size="11" fill="#fdba74" text-anchor="middle" letter-spacing="1">Speed • Swift Action • Sudden Breakthrough &amp; Momentum</text>
    </g>
  </g>
</svg>
