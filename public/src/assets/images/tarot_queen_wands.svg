<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="35%" stop-color="#78350f" />
      <stop offset="65%" stop-color="#b45309" />
      <stop offset="85%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <linearGradient id="goldFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="20%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="80%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <linearGradient id="throneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="80%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <linearGradient id="staffGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="40%" stop-color="#fde047" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>

    <linearGradient id="queenRobe" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#fef08a" stop-opacity="0.6" />
      <stop offset="80%" stop-color="#f59e0b" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#78350f" stop-opacity="0" />
    </radialGradient>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feOffset dx="2" dy="4" result="offset" />
      <feComposite in="SourceGraphic" in2="offset" operator="over" />
    </filter>
  </defs>

  <!-- Background Sky -->
  <rect width="600" height="800" fill="url(#skyGrad)" rx="24" />

  <!-- Sun Radiance -->
  <circle cx="300" cy="240" r="220" fill="url(#sunGlow)" />

  <!-- Pyramids in Background -->
  <polygon points="40,500 180,340 320,500" fill="#78350f" opacity="0.8" />
  <polygon points="280,500 420,360 560,500" fill="#92400e" opacity="0.9" />

  <!-- Sunflowers in Background Fields -->
  <g id="sunflowerFields" transform="translate(0, 460)">
    <circle cx="90" cy="0" r="20" fill="#eab308" filter="url(#glow)" />
    <circle cx="90" cy="0" r="10" fill="#451a03" />

    <circle cx="510" cy="0" r="20" fill="#eab308" filter="url(#glow)" />
    <circle cx="510" cy="0" r="10" fill="#451a03" />
  </g>

  <!-- Ground Terrain -->
  <path d="M 0 500 Q 300 460 600 500 L 600 800 L 0 800 Z" fill="#d97706" />
  <path d="M 0 540 Q 300 500 600 540 L 600 800 L 0 800 Z" fill="#b45309" />

  <!-- Golden Lion Throne -->
  <g id="lionThrone" transform="translate(180, 200)">
    <!-- Throne Backrest with Carved Lions & Sunflowers -->
    <rect x="20" y="0" width="200" height="340" rx="20" fill="url(#throneGrad)" stroke="url(#goldFrame)" stroke-width="3" filter="url(#softShadow)" />
    <!-- Lion Head Carvings on Throne Top Corners -->
    <circle cx="30" cy="30" r="18" fill="#fde047" stroke="#b45309" stroke-width="2" />
    <circle cx="210" cy="30" r="18" fill="#fde047" stroke="#b45309" stroke-width="2" />

    <!-- Throne Seat Base -->
    <rect x="0" y="240" width="240" height="100" rx="10" fill="url(#throneGrad)" stroke="url(#goldFrame)" stroke-width="3" />
  </g>

  <!-- Queen Enthroned -->
  <g id="queenFigure" transform="translate(300, 260)">
    <!-- Golden Royal Robe -->
    <path d="M -50 80 Q -100 200 -70 300 L 70 300 Q 100 200 50 80 Z" fill="url(#queenRobe)" filter="url(#softShadow)" />
    <!-- White Inner Mantle -->
    <path d="M -30 60 L 30 60 L 40 290 L -40 290 Z" fill="#f8fafc" />

    <!-- Queen Head & Crown -->
    <circle cx="0" cy="20" r="24" fill="#fed7aa" />
    <!-- Golden Crown -->
    <path d="M -22 8 L -26 -15 L -12 -5 L 0 -22 L 12 -5 L 26 -15 L 22 8 Z" fill="url(#goldFrame)" stroke="#78350f" stroke-width="1.5" filter="url(#glow)" />

    <!-- Right Hand Holding Sprouted Staff -->
    <g transform="translate(45, 60)">
      <rect x="-8" y="-180" width="16" height="420" rx="8" fill="url(#staffGrad)" filter="url(#softShadow)" />
      <circle cx="0" cy="-180" r="12" fill="#fef08a" filter="url(#glow)" />
      <!-- Sprouted Leaves -->
      <path d="M 8 -140 Q 40 -160 20 -110 Z" fill="#22c55e" stroke="#15803d" stroke-width="1" />
      <path d="M -8 -100 Q -40 -120 -20 -70 Z" fill="#22c55e" stroke="#15803d" stroke-width="1" />
    </g>

    <!-- Left Hand Holding Glowing Golden Sunflower -->
    <g transform="translate(-45, 120)">
      <circle cx="0" cy="0" r="18" fill="#fef08a" filter="url(#glow)" />
      <circle cx="0" cy="0" r="8" fill="#78350f" />
      <path d="M -18 0 Q 0 -25 18 0 Q 0 25 -18 0 Z" fill="#f59e0b" />
      <path d="M 0 -18 Q 25 0 0 18 Q -25 0 0 -18 Z" fill="#f59e0b" />
    </g>
  </g>

  <!-- Mystical Black Cat Sitting Serenely at Queen's Feet -->
  <g id="blackCat" transform="translate(300, 530)">
    <!-- Body -->
    <ellipse cx="0" cy="30" rx="18" ry="25" fill="#0f172a" filter="url(#softShadow)" />
    <!-- Head -->
    <circle cx="0" cy="0" r="14" fill="#0f172a" />
    <!-- Ears -->
    <polygon points="-12,-8 -6,-22 -2,-10" fill="#0f172a" />
    <polygon points="12,-8 6,-22 2,-10" fill="#0f172a" />
    <!-- Glowing Golden Eyes -->
    <circle cx="-5" cy="-2" r="3" fill="#fef08a" filter="url(#glow)" />
    <circle cx="5" cy="-2" r="3" fill="#fef08a" filter="url(#glow)" />
    <!-- Tail -->
    <path d="M 12 40 Q 35 30 30 10" fill="none" stroke="#0f172a" stroke-width="5" stroke-linecap="round" />
  </g>

  <!-- Golden Mystical Ornate Border Frame -->
  <g id="tarotBorder">
    <!-- Outer Border -->
    <rect x="16" y="16" width="568" height="768" rx="20" fill="none" stroke="url(#goldFrame)" stroke-width="6" />
    <rect x="26" y="26" width="548" height="748" rx="14" fill="none" stroke="url(#goldFrame)" stroke-width="1.5" stroke-dasharray="8,4" />

    <!-- Four Corner Filigree Scrolls -->
    <path d="M 30 60 C 30 35, 35 30, 60 30 C 45 45, 45 45, 30 60 Z" fill="url(#goldFrame)" />
    <circle cx="45" cy="45" r="4" fill="#fef08a" />
    <path d="M 570 60 C 570 35, 565 30, 540 30 C 555 45, 555 45, 570 60 Z" fill="url(#goldFrame)" />
    <circle cx="555" cy="45" r="4" fill="#fef08a" />
    <path d="M 30 740 C 30 765, 35 770, 60 770 C 45 755, 45 755, 30 740 Z" fill="url(#goldFrame)" />
    <circle cx="45" cy="755" r="4" fill="#fef08a" />
    <path d="M 570 740 C 570 765, 565 770, 540 770 C 555 755, 555 755, 570 740 Z" fill="url(#goldFrame)" />
    <circle cx="555" cy="755" r="4" fill="#fef08a" />

    <!-- Top Header Badge -->
    <g transform="translate(300, 48)">
      <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#0f172a" stroke="url(#goldFrame)" stroke-width="2" />
      <text x="0" y="5" font-family="'Cinzel', Georgia, serif" font-size="15" font-weight="bold" fill="#fef08a" text-anchor="middle" letter-spacing="2">QUEEN OF WANDS</text>
    </g>

    <!-- Bottom Footer Badge -->
    <g transform="translate(300, 736)">
      <rect x="-210" y="-22" width="420" height="44" rx="22" fill="#0f172a" stroke="url(#goldFrame)" stroke-width="2" />
      <text x="0" y="-2" font-family="'Cinzel', Georgia, serif" font-size="15" font-weight="bold" fill="#fef08a" text-anchor="middle">आभा स्वामिनी (Radiant Sovereign)</text>
      <text x="0" y="15" font-family="sans-serif" font-size="11" fill="#fdba74" text-anchor="middle" letter-spacing="1">Charisma • Confidence • Warmth &amp; Fiery Magnetism</text>
    </g>
  </g>
</svg>
