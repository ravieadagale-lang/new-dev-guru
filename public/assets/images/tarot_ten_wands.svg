<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="35%" stop-color="#451a03" />
      <stop offset="65%" stop-color="#78350f" />
      <stop offset="85%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <linearGradient id="goldFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="20%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="80%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <linearGradient id="staffGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="40%" stop-color="#fde047" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feOffset dx="2" dy="4" result="offset" />
      <feComposite in="SourceGraphic" in2="offset" operator="over" />
    </filter>
  </defs>

  <!-- Background Sky -->
  <rect width="600" height="800" fill="url(#skyGrad)" rx="24" />

  <!-- Distant Village & Estate Destination Horizon -->
  <g transform="translate(380, 420)" opacity="0.9">
    <path d="M 0 60 L 0 20 L 30 0 L 60 20 L 60 60 Z" fill="#9a3412" />
    <path d="M 50 60 L 50 30 L 90 30 L 90 60 Z" fill="#78350f" />
    <polygon points="120,60 140,20 160,60" fill="#a16207" />
  </g>

  <!-- Ground Path -->
  <path d="M 0 520 Q 300 480 600 520 L 600 800 L 0 800 Z" fill="#15803d" />
  <path d="M 0 560 Q 300 520 600 560 L 600 800 L 0 800 Z" fill="#166534" />
  <path d="M 120 780 C 200 680, 300 580, 420 500 L 460 500 C 350 580, 250 680, 180 780 Z" fill="#ca8a04" opacity="0.6" />

  <!-- Figure Carrying Bundle of Ten Heavy Staves -->
  <g id="burdenedFigure" transform="translate(180, 260)">
    <!-- Ten Heavy Sprouted Staves Fan-Out Bundle -->
    <g id="tenStavesBundle" transform="rotate(-15)">
      <line x1="-60" y1="-120" x2="280" y2="220" stroke="url(#staffGrad)" stroke-width="12" stroke-linecap="round" filter="url(#softShadow)" />
      <line x1="-40" y1="-130" x2="290" y2="210" stroke="url(#staffGrad)" stroke-width="12" stroke-linecap="round" />
      <line x1="-20" y1="-140" x2="300" y2="200" stroke="url(#staffGrad)" stroke-width="12" stroke-linecap="round" />
      <line x1="0" y1="-150" x2="310" y2="190" stroke="url(#staffGrad)" stroke-width="12" stroke-linecap="round" />
      <line x1="20" y1="-160" x2="320" y2="180" stroke="url(#staffGrad)" stroke-width="12" stroke-linecap="round" />
      <line x1="40" y1="-150" x2="330" y2="190" stroke="url(#staffGrad)" stroke-width="12" stroke-linecap="round" />
      <line x1="60" y1="-140" x2="340" y2="200" stroke="url(#staffGrad)" stroke-width="12" stroke-linecap="round" />
      <line x1="80" y1="-130" x2="350" y2="210" stroke="url(#staffGrad)" stroke-width="12" stroke-linecap="round" />
      <line x1="100" y1="-120" x2="360" y2="220" stroke="url(#staffGrad)" stroke-width="12" stroke-linecap="round" />
      <line x1="120" y1="-110" x2="370" y2="230" stroke="url(#staffGrad)" stroke-width="12" stroke-linecap="round" />

      <!-- Sprouted Leaves on Bundle Tips -->
      <circle cx="-60" cy="-120" r="8" fill="#fef08a" />
      <circle cx="0" cy="-150" r="8" fill="#fef08a" />
      <circle cx="60" cy="-140" r="8" fill="#fef08a" />
      <circle cx="120" cy="-110" r="8" fill="#fef08a" />
    </g>

    <!-- Bent Figure Body -->
    <path d="M 0 100 Q 60 70 120 120 L 100 240 L 40 240 Z" fill="#b91c1c" filter="url(#softShadow)" />
    <path d="M 20 100 Q 70 80 110 120 L 90 230 L 50 230 Z" fill="#991b1b" />

    <!-- Head bent under wands -->
    <circle cx="110" cy="100" r="18" fill="#fed7aa" />
  </g>

  <!-- Golden Mystical Ornate Border Frame -->
  <g id="tarotBorder">
    <!-- Outer Border -->
    <rect x="16" y="16" width="568" height="768" rx="20" fill="none" stroke="url(#goldFrame)" stroke-width="6" />
    <rect x="26" y="26" width="548" height="748" rx="14" fill="none" stroke="url(#goldFrame)" stroke-width="1.5" stroke-dasharray="8,4" />

    <!-- Four Corner Filigree Scrolls -->
    <path d="M 30 60 C 30 35, 35 30, 60 30 C 45 45, 45 45, 30 60 Z" fill="url(#goldFrame)" />
    <circle cx="45" cy="45" r="4" fill="#fef08a" />
    <path d="M 570 60 C 570 35, 565 30, 540 30 C 555 45, 555 45, 570 60 Z" fill="url(#goldFrame)" />
    <circle cx="555" cy="45" r="4" fill="#fef08a" />
    <path d="M 30 740 C 30 765, 35 770, 60 770 C 45 755, 45 755, 30 740 Z" fill="url(#goldFrame)" />
    <circle cx="45" cy="755" r="4" fill="#fef08a" />
    <path d="M 570 740 C 570 765, 565 770, 540 770 C 555 755, 555 755, 570 740 Z" fill="url(#goldFrame)" />
    <circle cx="555" cy="755" r="4" fill="#fef08a" />

    <!-- Top Header Badge -->
    <g transform="translate(300, 48)">
      <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#0f172a" stroke="url(#goldFrame)" stroke-width="2" />
      <text x="0" y="5" font-family="'Cinzel', Georgia, serif" font-size="15" font-weight="bold" fill="#fef08a" text-anchor="middle" letter-spacing="2">X • TEN OF WANDS</text>
    </g>

    <!-- Bottom Footer Badge -->
    <g transform="translate(300, 736)">
      <rect x="-210" y="-22" width="420" height="44" rx="22" fill="#0f172a" stroke="url(#goldFrame)" stroke-width="2" />
      <text x="0" y="-2" font-family="'Cinzel', Georgia, serif" font-size="15" font-weight="bold" fill="#fef08a" text-anchor="middle">भार वहन (Heavy Duty &amp; Perseverance)</text>
      <text x="0" y="15" font-family="sans-serif" font-size="11" fill="#fdba74" text-anchor="middle" letter-spacing="1">Heavy Burden • Hard Work • Perseverance Near Goal</text>
    </g>
  </g>
</svg>
