<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="earthBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061a12" />
      <stop offset="50%" stop-color="#113826" />
      <stop offset="100%" stop-color="#04120c" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
  </defs>

  <rect width="600" height="800" fill="url(#earthBg)" rx="24" />

  <!-- Stars & Emerald Sparkles -->
  <circle cx="100" cy="110" r="2.5" fill="#fef08a" opacity="0.9" />
  <circle cx="480" cy="140" r="3" fill="#4ade80" opacity="0.8" />
  <circle cx="210" cy="200" r="2" fill="#fff" opacity="0.7" />
  <circle cx="410" cy="260" r="2" fill="#fef08a" opacity="0.9" />

  <!-- Frame -->
  <rect x="20" y="20" width="560" height="760" fill="none" stroke="url(#goldGrad)" stroke-width="6" rx="16" />
  <rect x="30" y="30" width="540" height="740" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="8,4" rx="12" />

  <!-- Title Badge -->
  <rect x="130" y="45" width="340" height="40" fill="#061a12" stroke="url(#goldGrad)" stroke-width="2" rx="20" />
  <text x="300" y="71" font-family="'Cinzel', Georgia, serif" font-size="18" font-weight="bold" fill="#fef08a" text-anchor="middle" letter-spacing="2">PAGE OF PENTACLES</text>

  <!-- Page Figure Symbolism: Hands holding Golden Coin in Meadow -->
  <g transform="translate(300, 400)">
    <!-- Aura -->
    <circle cx="0" cy="-20" r="140" fill="none" stroke="#22c55e" stroke-width="2" opacity="0.4" stroke-dasharray="8,6" />
    
    <!-- Blooming Meadow Base -->
    <ellipse cx="0" cy="180" rx="200" ry="40" fill="#15803d" opacity="0.8" />
    <path d="M -160,180 Q -100,120 0,180 Q 100,220 160,180" fill="none" stroke="#4ade80" stroke-width="3" />
    <circle cx="-80" cy="160" r="8" fill="#fef08a" />
    <circle cx="90" cy="170" r="6" fill="#fef08a" />
    
    <!-- Golden Pentacle -->
    <circle cx="0" cy="-30" r="90" fill="url(#goldGrad)" />
    <circle cx="0" cy="-30" r="78" fill="none" stroke="#061a12" stroke-width="3.5" />
    <polygon points="0,-95 19,-50 65,-50 29,-20 42,25 0,-4 -42,25 -29,-20 -65,-50 -19,-50" fill="#061a12" transform="translate(0, -30) scale(0.7)" />
    
    <!-- Green Sprouts Growing around Pentacle -->
    <path d="M -80,50 C -70,-10 -30,-40 -10,-30" fill="none" stroke="#4ade80" stroke-width="4" stroke-linecap="round" />
    <path d="M 80,50 C 70,-10 30,-40 10,-30" fill="none" stroke="#4ade80" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Sanskrit Title -->
  <text x="300" y="720" font-family="sans-serif" font-size="16" fill="#fef08a" text-anchor="middle" opacity="0.9">विद्या साधक (Dedicated Student & Ambition)</text>
</svg>
