<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="earthBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061a12" />
      <stop offset="50%" stop-color="#113826" />
      <stop offset="100%" stop-color="#04120c" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
  </defs>

  <rect width="600" height="800" fill="url(#earthBg)" rx="24" />

  <!-- Stars & Emerald Sparkles -->
  <circle cx="100" cy="110" r="2.5" fill="#fef08a" opacity="0.9" />
  <circle cx="480" cy="140" r="3" fill="#4ade80" opacity="0.8" />
  <circle cx="210" cy="200" r="2" fill="#fff" opacity="0.7" />

  <!-- Frame -->
  <rect x="20" y="20" width="560" height="760" fill="none" stroke="url(#goldGrad)" stroke-width="6" rx="16" />
  <rect x="30" y="30" width="540" height="740" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="8,4" rx="12" />

  <!-- Title Badge -->
  <rect x="130" y="45" width="340" height="40" fill="#061a12" stroke="url(#goldGrad)" stroke-width="2" rx="20" />
  <text x="300" y="71" font-family="'Cinzel', Georgia, serif" font-size="18" font-weight="bold" fill="#fef08a" text-anchor="middle" letter-spacing="2">III - THREE OF PENTACLES</text>

  <!-- Cathedral Arch with 3 Pentacles -->
  <g transform="translate(300, 390)">
    <!-- Gothic Archway -->
    <path d="M -160,180 L -160,-60 Q -160,-180 0,-240 Q 160,-180 160,-60 L 160,180 Z" fill="none" stroke="url(#goldGrad)" stroke-width="4" />
    <path d="M -140,180 L -140,-50 Q -140,-160 0,-210 Q 140,-160 140,-50 L 140,180 Z" fill="none" stroke="#22c55e" stroke-width="1.5" opacity="0.6" />

    <!-- Three Golden Coins inside Arch -->
    <!-- Top Coin -->
    <g transform="translate(0, -110)">
      <circle cx="0" cy="0" r="45" fill="url(#goldGrad)" />
      <circle cx="0" cy="0" r="38" fill="none" stroke="#061a12" stroke-width="2.5" />
      <polygon points="0,-32 9,-10 32,-10 14,3 21,24 0,11 -21,24 -14,3 -32,-10 -9,-10" fill="#061a12" />
    </g>
    <!-- Left Coin -->
    <g transform="translate(-70, 20)">
      <circle cx="0" cy="0" r="45" fill="url(#goldGrad)" />
      <circle cx="0" cy="0" r="38" fill="none" stroke="#061a12" stroke-width="2.5" />
      <polygon points="0,-32 9,-10 32,-10 14,3 21,24 0,11 -21,24 -14,3 -32,-10 -9,-10" fill="#061a12" />
    </g>
    <!-- Right Coin -->
    <g transform="translate(70, 20)">
      <circle cx="0" cy="0" r="45" fill="url(#goldGrad)" />
      <circle cx="0" cy="0" r="38" fill="none" stroke="#061a12" stroke-width="2.5" />
      <polygon points="0,-32 9,-10 32,-10 14,3 21,24 0,11 -21,24 -14,3 -32,-10 -9,-10" fill="#061a12" />
    </g>

    <!-- Pillar Bases -->
    <rect x="-180" y="160" width="40" height="20" fill="url(#goldGrad)" rx="2" />
    <rect x="140" y="160" width="40" height="20" fill="url(#goldGrad)" rx="2" />
  </g>

  <!-- Sanskrit Title -->
  <text x="300" y="720" font-family="sans-serif" font-size="16" fill="#fef08a" text-anchor="middle" opacity="0.9">शिल्प योग (Master Craftsmanship & Teamwork)</text>
</svg>
