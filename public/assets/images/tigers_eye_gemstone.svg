<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tigerBands" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="15%" stop-color="#f59e0b"/>
      <stop offset="30%" stop-color="#451a03"/>
      <stop offset="45%" stop-color="#fbbf24"/>
      <stop offset="60%" stop-color="#b45309"/>
      <stop offset="75%" stop-color="#fef08a"/>
      <stop offset="90%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#292524"/>
    </linearGradient>
    <linearGradient id="shineOverlay" x1="0%" y1="0%" x2="50%" y2="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad)"/>
  <circle cx="400" cy="300" r="260" fill="url(#glowGrad)"/>

  <!-- Gemstone Shadow & Base -->
  <g filter="url(#dropShadow)">
    <ellipse cx="400" cy="300" rx="220" ry="160" fill="url(#tigerBands)" transform="rotate(-15 400 300)"/>
  </g>

  <!-- Chatoyant Band Details -->
  <g transform="rotate(-15 400 300)" opacity="0.85">
    <path d="M 180 280 Q 300 230, 420 280 T 620 280" fill="none" stroke="#fef08a" stroke-width="12" opacity="0.7"/>
    <path d="M 190 320 Q 320 270, 450 320 T 610 320" fill="none" stroke="#fbbf24" stroke-width="18" opacity="0.6"/>
    <path d="M 210 240 Q 340 190, 470 240 T 590 240" fill="none" stroke="#d97706" stroke-width="14" opacity="0.8"/>
    <path d="M 200 360 Q 350 310, 480 360 T 580 360" fill="none" stroke="#f59e0b" stroke-width="10" opacity="0.7"/>
  </g>

  <!-- High Gloss Cabochon Polish Highlight -->
  <ellipse cx="340" cy="230" rx="130" ry="70" fill="url(#shineOverlay)" transform="rotate(-25 340 230)"/>
  <circle cx="280" cy="200" r="12" fill="#ffffff" opacity="0.8"/>

  <!-- Label badge -->
  <rect x="220" y="520" width="360" height="44" rx="22" fill="#0f172a" stroke="#d97706" stroke-width="1.5"/>
  <text x="400" y="548" font-family="Cinzel, Georgia, serif" font-size="18" font-weight="bold" fill="#fef08a" text-anchor="middle">
    NATURAL TIGER'S EYE (व्याघ्रचक्षु)
  </text>
</svg>
