<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="schorlFacet1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="40%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="schorlHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#94a3b8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000" flood-opacity="0.95"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Jet Black Striated Tourmaline Prism Rod -->
  <g filter="url(#shadow)" transform="translate(400, 270)">
    <!-- Pyramid Termination Head -->
    <polygon points="0,-200 -120,-80 0,-30" fill="#1e293b"/>
    <polygon points="0,-200 0,-30 120,-80" fill="#0f172a"/>
    <polygon points="0,-200 120,-80 150,-120" fill="#020617"/>

    <!-- Prismatic Striated Shaft -->
    <polygon points="-120,-80 0,-30 0,190 -110,140" fill="url(#schorlFacet1)"/>
    <polygon points="0,-30 120,-80 110,140 0,190" fill="#090d16"/>

    <!-- Vertical Striation Grooves (Schorl Texture) -->
    <line x1="-100" y1="-72" x2="-92" y2="148" stroke="#64748b" stroke-width="2" opacity="0.6"/>
    <line x1="-80" y1="-64" x2="-74" y2="156" stroke="#475569" stroke-width="2.5" opacity="0.7"/>
    <line x1="-60" y1="-55" x2="-55" y2="165" stroke="#94a3b8" stroke-width="1.5" opacity="0.8"/>
    <line x1="-40" y1="-47" x2="-36" y2="173" stroke="#334155" stroke-width="3" opacity="0.5"/>
    <line x1="-20" y1="-38" x2="-18" y2="182" stroke="#cbd5e1" stroke-width="1.5" opacity="0.9"/>

    <line x1="20" y1="-38" x2="18" y2="182" stroke="#475569" stroke-width="2" opacity="0.6"/>
    <line x1="50" y1="-50" x2="46" y2="168" stroke="#334155" stroke-width="2.5" opacity="0.7"/>
    <line x1="80" y1="-63" x2="74" y2="154" stroke="#64748b" stroke-width="1.5" opacity="0.5"/>

    <!-- Sharp Glassy Specular Highlight -->
    <polygon points="0,-200 -5,-35 -18,182" fill="url(#schorlHighlight)"/>
  </g>

  <!-- Label Badge -->
  <rect x="220" y="520" width="360" height="44" rx="22" fill="#020617" stroke="#475569" stroke-width="1.5"/>
  <text x="400" y="548" font-family="Cinzel, Georgia, serif" font-size="18" font-weight="bold" fill="#f8fafc" text-anchor="middle">
    BLACK TOURMALINE (कृष्ण तुर्मली)
  </text>
</svg>
