<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="airBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021329" />
      <stop offset="50%" stop-color="#0f2b48" />
      <stop offset="100%" stop-color="#05101e" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
  </defs>

  <rect width="600" height="800" fill="url(#airBg)" rx="24" />

  <!-- Stars -->
  <circle cx="100" cy="100" r="2" fill="#fff" opacity="0.9" />
  <circle cx="500" cy="130" r="2.5" fill="#fef08a" opacity="0.8" />
  <circle cx="220" cy="180" r="1.5" fill="#fff" opacity="0.7" />
  <circle cx="400" cy="220" r="2" fill="#38bdf8" opacity="0.8" />

  <!-- Frame -->
  <rect x="20" y="20" width="560" height="760" fill="none" stroke="url(#goldGrad)" stroke-width="6" rx="16" />
  <rect x="30" y="30" width="540" height="740" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="8,4" rx="12" />

  <!-- Title Badge -->
  <rect x="150" y="45" width="300" height="40" fill="#021329" stroke="url(#goldGrad)" stroke-width="2" rx="20" />
  <text x="300" y="70" font-family="'Cinzel', Georgia, serif" font-size="18" font-weight="bold" fill="#fef08a" text-anchor="middle" letter-spacing="2">ACE OF SWORDS</text>

  <!-- Luminous Sword -->
  <g transform="translate(300, 400)">
    <!-- Aura -->
    <circle cx="0" cy="-40" r="130" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.4" stroke-dasharray="8,6" />
    <!-- Blade -->
    <path d="M 0 -220 L 16 80 L -16 80 Z" fill="url(#silverGrad)" />
    <line x1="0" y1="-220" x2="0" y2="80" stroke="#38bdf8" stroke-width="2" />
    <!-- Hilt & Crossguard -->
    <rect x="-70" y="80" width="140" height="16" fill="url(#goldGrad)" rx="4" />
    <circle cx="0" cy="88" r="12" fill="#fef08a" />
    <rect x="-10" y="96" width="20" height="60" fill="url(#goldGrad)" rx="4" />
    <circle cx="0" cy="165" r="14" fill="url(#goldGrad)" />
    <!-- Crown at Top of Blade -->
    <path d="M -30 -160 L -15 -180 L 0 -150 L 15 -180 L 30 -160 Z" fill="url(#goldGrad)" />
  </g>

  <!-- Sanskrit Title -->
  <text x="300" y="720" font-family="sans-serif" font-size="16" fill="#fef08a" text-anchor="middle" opacity="0.9">सत्य खड्ग (Blade of Absolute Truth)</text>
</svg>
