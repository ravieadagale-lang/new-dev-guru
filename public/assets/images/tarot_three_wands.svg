<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="sunsetSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="40%" stop-color="#9a3412" />
      <stop offset="80%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
    <linearGradient id="goldSea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
  </defs>

  <rect width="600" height="800" fill="url(#sunsetSky)" rx="20" />

  <!-- Frame -->
  <rect x="18" y="18" width="564" height="764" fill="none" stroke="url(#goldGrad)" stroke-width="5" rx="16" />
  <rect x="28" y="28" width="544" height="744" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="6,4" rx="12" />

  <!-- Title Badge -->
  <g transform="translate(300, 52)">
    <rect x="-140" y="-18" width="280" height="36" fill="#312e81" stroke="url(#goldGrad)" stroke-width="2" rx="18" />
    <text x="0" y="5" font-family="'Cinzel', Georgia, serif" font-size="16" font-weight="bold" fill="#fef08a" text-anchor="middle" letter-spacing="2">III - THREE OF WANDS</text>
  </g>

  <!-- Golden Ocean & Sailing Ships -->
  <path d="M 30 420 C 150 400, 300 440, 570 410 L 570 760 L 30 760 Z" fill="url(#goldSea)" />

  <!-- Ships on Horizon -->
  <g fill="#451a03">
    <!-- Ship 1 -->
    <path d="M 160 410 L 180 410 L 175 420 L 165 420 Z" />
    <path d="M 170 380 L 170 410 M 170 385 L 180 395 L 170 400 Z" />
    <!-- Ship 2 -->
    <path d="M 380 415 L 405 415 L 400 427 L 385 427 Z" />
    <path d="M 392 375 L 392 415 M 392 380 L 405 395 L 392 402 Z" />
  </g>

  <!-- Cliffs & Traveler looking out over Sea -->
  <g transform="translate(300, 390)">
    <!-- Cliff Promontory Base -->
    <path d="M -180 180 L -180 60 L -60 40 L 40 80 L 180 60 L 180 180 Z" fill="#451a03" stroke="url(#goldGrad)" stroke-width="1.5" />

    <!-- Three Planted Sprouted Staves -->
    <rect x="-100" y="-180" width="16" height="280" fill="url(#goldGrad)" rx="8" />
    <path d="M -100 -140 Q -130 -160 -110 -120 Z" fill="#22c55e" />

    <rect x="-30" y="-200" width="16" height="300" fill="url(#goldGrad)" rx="8" />
    <path d="M -30 -160 Q -60 -180 -40 -120 Z" fill="#22c55e" />

    <rect x="40" y="-180" width="16" height="280" fill="url(#goldGrad)" rx="8" />
    <path d="M 40 -140 Q 10 -160 30 -120 Z" fill="#22c55e" />

    <!-- Figure standing back facing ocean -->
    <g transform="translate(-10, -20)">
      <path d="M -20 -30 Q 0 -50 20 -30 L 25 90 Q 0 100 -25 90 Z" fill="#b45309" />
      <circle cx="0" cy="-45" r="16" fill="#fed7aa" />
      <path d="M -10 -55 Q 0 -65 10 -55 Z" fill="#78350f" />
    </g>
  </g>

  <!-- Sanskrit Title Footer -->
  <g transform="translate(300, 735)">
    <text x="0" y="0" font-family="sans-serif" font-size="16" font-weight="bold" fill="#fef08a" text-anchor="middle">आशा आगमन (Ships Coming In)</text>
    <text x="0" y="18" font-family="sans-serif" font-size="12" fill="#fca5a5" text-anchor="middle" opacity="0.9">Enterprise • Long-Distance Momentum • Arrival of Success</text>
  </g>
</svg>
