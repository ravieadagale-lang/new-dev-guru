<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="earthBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061a12" />
      <stop offset="50%" stop-color="#113826" />
      <stop offset="100%" stop-color="#04120c" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
  </defs>

  <rect width="600" height="800" fill="url(#earthBg)" rx="24" />

  <!-- Stars & Emerald Sparkles -->
  <circle cx="110" cy="120" r="2.5" fill="#fef08a" opacity="0.9" />
  <circle cx="490" cy="150" r="3" fill="#4ade80" opacity="0.8" />

  <!-- Frame -->
  <rect x="20" y="20" width="560" height="760" fill="none" stroke="url(#goldGrad)" stroke-width="6" rx="16" />
  <rect x="30" y="30" width="540" height="740" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="8,4" rx="12" />

  <!-- Title Badge -->
  <rect x="120" y="45" width="360" height="40" fill="#061a12" stroke="url(#goldGrad)" stroke-width="2" rx="20" />
  <text x="300" y="71" font-family="'Cinzel', Georgia, serif" font-size="18" font-weight="bold" fill="#fef08a" text-anchor="middle" letter-spacing="2">KNIGHT OF PENTACLES</text>

  <!-- Knight Symbolism: Knight Shield & Golden Pentacle over Fields -->
  <g transform="translate(300, 390)">
    <!-- Tilled Field Curves -->
    <path d="M -220,180 Q 0,100 220,180" fill="none" stroke="#eab308" stroke-width="3" opacity="0.6" />
    <path d="M -220,210 Q 0,130 220,210" fill="none" stroke="#15803d" stroke-width="4" opacity="0.8" />
    
    <!-- Knight Shield -->
    <path d="M 0,-120 L 100,-80 L 80,60 L 0,130 L -80,60 L -100,-80 Z" fill="#061a12" stroke="url(#goldGrad)" stroke-width="5" />
    
    <!-- Golden Pentacle Emblem on Shield -->
    <circle cx="0" cy="-10" r="50" fill="url(#goldGrad)" />
    <circle cx="0" cy="-10" r="42" fill="none" stroke="#061a12" stroke-width="2.5" />
    <polygon points="0,-45 10,-20 35,-20 15,-5 22,20 0,5 -22,20 -15,-5 -35,-20 -10,-20" fill="#061a12" transform="translate(0, -10) scale(0.8)" />
  </g>

  <!-- Sanskrit Title -->
  <text x="300" y="720" font-family="sans-serif" font-size="16" fill="#fef08a" text-anchor="middle" opacity="0.9">धैर्य रक्षक (Steadfast Provider & Duty)</text>
</svg>
