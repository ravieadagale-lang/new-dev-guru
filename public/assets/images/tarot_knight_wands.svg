<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#450a0a" />
      <stop offset="35%" stop-color="#7f1d1d" />
      <stop offset="65%" stop-color="#c2410c" />
      <stop offset="85%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <linearGradient id="goldFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="20%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="80%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <linearGradient id="staffGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="40%" stop-color="#fde047" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>

    <linearGradient id="steedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#7c2d12" />
    </linearGradient>

    <linearGradient id="armorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="40%" stop-color="#94a3b8" />
      <stop offset="80%" stop-color="#475569" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feOffset dx="2" dy="4" result="offset" />
      <feComposite in="SourceGraphic" in2="offset" operator="over" />
    </filter>
  </defs>

  <!-- Background Sky -->
  <rect width="600" height="800" fill="url(#skyGrad)" rx="24" />

  <!-- Pyramidal Desert Peaks in Background -->
  <polygon points="20,540 180,320 340,540" fill="#7f1d1d" opacity="0.8" />
  <polygon points="240,540 400,360 560,540" fill="#991b1b" opacity="0.9" />

  <!-- Desert Dunes Terrain -->
  <path d="M 0 520 Q 300 480 600 520 L 600 800 L 0 800 Z" fill="#b45309" />
  <path d="M 0 560 Q 300 520 600 560 L 600 800 L 0 800 Z" fill="#78350f" />

  <!-- Fiery Rearing Steed -->
  <g id="rearingSteed" transform="translate(180, 240)">
    <!-- Horse Body rearing up -->
    <path d="M -40 180 C -80 120, -60 -20, 40 -80 C 120 -100, 180 -20, 200 60 C 210 100, 180 180, 120 220 L -40 220 Z" fill="url(#steedGrad)" filter="url(#softShadow)" />

    <!-- Horse Rearing Head & Flames Mane -->
    <path d="M 40 -80 C 80 -140, 150 -150, 180 -100 C 200 -70, 180 -20, 140 0 Z" fill="url(#steedGrad)" />
    <!-- Flaming Mane -->
    <path d="M 40 -90 Q -10 -130 30 -160 Q 90 -120 60 -80 Z" fill="#ef4444" filter="url(#glow)" />
    <path d="M 80 -120 Q 30 -160 70 -190 Q 130 -150 100 -110 Z" fill="#fef08a" filter="url(#glow)" />

    <!-- Rearing Front Legs -->
    <line x1="160" y1="20" x2="220" y2="-60" stroke="#ea580c" stroke-width="18" stroke-linecap="round" />
    <line x1="180" y1="40" x2="250" y2="-30" stroke="#c2410c" stroke-width="16" stroke-linecap="round" />
  </g>

  <!-- Armored Knight Riding Rearing Steed -->
  <g id="armoredKnight" transform="translate(240, 180)">
    <!-- Yellow Surcoat with Flame / Salamander Pattern -->
    <path d="M -30 60 L 30 60 L 40 200 L -40 200 Z" fill="#eab308" filter="url(#softShadow)" />

    <!-- Steel Plate Armor Shoulders & Breastplate -->
    <circle cx="0" cy="50" r="28" fill="url(#armorGrad)" stroke="url(#goldFrame)" stroke-width="2" />

    <!-- Helmet & Streaming Fiery Plume -->
    <ellipse cx="0" cy="-10" rx="20" ry="24" fill="url(#armorGrad)" stroke="url(#goldFrame)" stroke-width="2" />
    <!-- Visor Slot -->
    <rect x="-12" y="-12" width="24" height="6" fill="#0f172a" />

    <!-- Streaming Crimson Plume Feather -->
    <path d="M -10 -30 Q -80 -90 -120 -60 Q -60 -40 -10 -20 Z" fill="#dc2626" filter="url(#glow)" />
    <path d="M -10 -30 Q -60 -80 -100 -50 Q -50 -30 -10 -20 Z" fill="#fef08a" filter="url(#glow)" />

    <!-- Right Arm Holding Sprouted Charging Wand -->
    <g transform="translate(20, 20)">
      <!-- Arm in Steel Armor -->
      <line x1="0" y1="20" x2="60" y2="-30" stroke="#94a3b8" stroke-width="16" stroke-linecap="round" />

      <!-- Sprouted Charging Wand -->
      <g transform="translate(60, -30)">
        <line x1="-120" y1="80" x2="180" y2="-120" stroke="url(#staffGrad)" stroke-width="16" stroke-linecap="round" filter="url(#softShadow)" />
        <circle cx="180" cy="-120" r="10" fill="#fef08a" filter="url(#glow)" />
        <path d="M 120 -80 Q 160 -100 140 -50 Z" fill="#22c55e" stroke="#15803d" stroke-width="1" />
      </g>
    </g>
  </g>

  <!-- Golden Mystical Ornate Border Frame -->
  <g id="tarotBorder">
    <!-- Outer Border -->
    <rect x="16" y="16" width="568" height="768" rx="20" fill="none" stroke="url(#goldFrame)" stroke-width="6" />
    <rect x="26" y="26" width="548" height="748" rx="14" fill="none" stroke="url(#goldFrame)" stroke-width="1.5" stroke-dasharray="8,4" />

    <!-- Four Corner Filigree Scrolls -->
    <path d="M 30 60 C 30 35, 35 30, 60 30 C 45 45, 45 45, 30 60 Z" fill="url(#goldFrame)" />
    <circle cx="45" cy="45" r="4" fill="#fef08a" />
    <path d="M 570 60 C 570 35, 565 30, 540 30 C 555 45, 555 45, 570 60 Z" fill="url(#goldFrame)" />
    <circle cx="555" cy="45" r="4" fill="#fef08a" />
    <path d="M 30 740 C 30 765, 35 770, 60 770 C 45 755, 45 755, 30 740 Z" fill="url(#goldFrame)" />
    <circle cx="45" cy="755" r="4" fill="#fef08a" />
    <path d="M 570 740 C 570 765, 565 770, 540 770 C 555 755, 555 755, 570 740 Z" fill="url(#goldFrame)" />
    <circle cx="555" cy="755" r="4" fill="#fef08a" />

    <!-- Top Header Badge -->
    <g transform="translate(300, 48)">
      <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#0f172a" stroke="url(#goldFrame)" stroke-width="2" />
      <text x="0" y="5" font-family="'Cinzel', Georgia, serif" font-size="15" font-weight="bold" fill="#fef08a" text-anchor="middle" letter-spacing="2">KNIGHT OF WANDS</text>
    </g>

    <!-- Bottom Footer Badge -->
    <g transform="translate(300, 736)">
      <rect x="-210" y="-22" width="420" height="44" rx="22" fill="#0f172a" stroke="url(#goldFrame)" stroke-width="2" />
      <text x="0" y="-2" font-family="'Cinzel', Georgia, serif" font-size="15" font-weight="bold" fill="#fef08a" text-anchor="middle">साहस वीर (Passionate Warrior)</text>
      <text x="0" y="15" font-family="sans-serif" font-size="11" fill="#fdba74" text-anchor="middle" letter-spacing="1">Action • Energy • Passionate Pursuit &amp; Adventure</text>
    </g>
  </g>
</svg>
